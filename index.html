<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Финансы с Арайлым</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Свой вид «Финансы с Арайлым»: темная тема по умолчанию, светлая ниже (html.light) */
  :root {
    --bg: #1a1e25;          /* карточки */
    --bg2: #0f1216;         /* фон страницы */
    --field: #242a33;       /* поля ввода */
    --text: #f2f4f6;
    --hint: #8f97a3;
    --accent: #2fd1b2;      /* бирюзовый */
    --accent-text: #08201b;
    --gold: #f4c542;        /* акцент для главных цифр */
    --ok: #3ccf7f;
    --warn: #f0a92e;
    --bad: #ff6b6b;
    --line: rgba(143, 151, 163, .18);
    --radius: 18px;
    --top: calc(var(--tg-safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px));
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg2); color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  main { padding: calc(var(--top) + 12px) 12px 96px; max-width: 640px; margin: 0 auto; }
  .hero .big { color: #062019; }
  .gold { color: var(--gold); }
  .stock .big { color: var(--gold); }
  .qa { border: 0; width: 40px; height: 40px; border-radius: 12px; background: color-mix(in srgb, var(--ok) 20%, transparent); color: var(--ok); font-size: 20px; font-weight: 700; flex: 0 0 auto; }
  .qa:disabled { opacity: .4; }
  .docrow { display: flex; gap: 10px; align-items: center; }
  .docrow .card { flex: 1; margin-bottom: 0; min-width: 0; }
  .doc .row > * { min-width: 0; overflow-wrap: anywhere; }
  html, body { overflow-x: hidden; }
  .dlist > * + * { margin-top: 8px; }
  h1 { font-size: 20px; margin: 4px 4px 12px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--hint); margin: 18px 6px 8px; font-weight: 600; }
  .card { background: var(--bg); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .muted { color: var(--hint); font-size: 13px; }
  .big { font-size: 28px; font-weight: 700; letter-spacing: -.01em; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .hero { background: linear-gradient(135deg, #2fd1b2 0%, #17a58b 100%); color: var(--accent-text); }
  .hero .muted { color: color-mix(in srgb, var(--accent-text) 80%, transparent); }
  .bar { height: 6px; border-radius: 3px; background: var(--bg2); overflow: hidden; margin-top: 6px; }
  .bar > i { display: block; height: 100%; background: var(--accent); }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .b-wait { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
  .b-ok { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
  .b-no, .b-err { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }
  .check-ok { color: var(--ok); } .check-bad { color: var(--bad); }
  .doc { cursor: pointer; }
  .doc + .doc { margin-top: -2px; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 0 2px 8px; }
  .chip { border: 0; background: var(--bg); color: var(--text); padding: 7px 12px; border-radius: 99px; font: inherit; font-size: 14px; white-space: nowrap; }
  .chip.on { background: var(--accent); color: var(--accent-text); }
  button.btn { border: 0; width: 100%; padding: 13px; border-radius: 12px; font: inherit; font-weight: 600; background: var(--accent); color: var(--accent-text); }
  button.btn.sec { background: var(--field); color: var(--text); }
  button.btn.ok { background: var(--ok); } button.btn.bad { background: var(--bad); }
  button.btn:disabled { opacity: .5; }
  .btns { display: grid; gap: 8px; margin-top: 10px; }
  .btns.two { grid-template-columns: 1fr 1fr; }
  label.f { display: block; margin-bottom: 10px; }
  label.f span { display: block; font-size: 12px; color: var(--hint); margin: 0 0 4px 2px; }
  input, select, textarea { width: 100%; font: inherit; color: var(--text); background: var(--field); border: 1px solid transparent; border-radius: 10px; padding: 10px; color-scheme: dark; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
  textarea { min-height: 60px; resize: vertical; }
  .thumbs { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
  .thumbs img, .thumbs .pdf { width: 76px; height: 96px; object-fit: cover; border-radius: 10px; background: var(--bg2); display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--hint); }
  main > .btns .btn.sec, main > .btns input { background: var(--bg); }
  .row h1 { font-size: 18px; white-space: nowrap; }
  .monthsw b { white-space: nowrap; font-size: 14px; }
  .drop { display: block; cursor: pointer; border: 2px dashed var(--line); border-radius: var(--radius); padding: 22px; text-align: center; color: var(--hint); }
  .drop b { color: var(--accent); display: block; font-size: 16px; margin-bottom: 4px; }
  .photos { display: flex; gap: 8px; overflow-x: auto; }
  .photos img { height: 220px; border-radius: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td { padding: 8px 4px; border-top: 1px solid var(--line); vertical-align: top; }
  td.n { text-align: right; white-space: nowrap; }
  .alt { font-size: 12px; } .alt.yes { color: var(--ok); } .alt.no { color: var(--hint); }
  nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg); display: flex; border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  nav button { flex: 1; border: 0; background: none; color: var(--hint); padding: 9px 0 10px; font: inherit; font-size: 12px; }
  nav button svg { display: block; margin: 0 auto 2px; width: 24px; height: 24px; }
  nav button.on { color: var(--accent); }
  .center { text-align: center; padding: 40px 10px; color: var(--hint); }
  .spin { width: 28px; height: 28px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: s 0.8s linear infinite; margin: 0 auto 10px; }
  @keyframes s { to { transform: rotate(360deg); } }
  .toast { position: fixed; left: 12px; right: 12px; bottom: 80px; background: #222; color: #fff; padding: 12px 14px; border-radius: 12px; font-size: 14px; z-index: 9; }
  .lowitem { display: flex; justify-content: space-between; padding: 6px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .lowitem:first-child { border-top: 0; }
  .monthsw { display: flex; align-items: center; gap: 6px; }
  .monthsw button { border: 0; background: var(--bg); color: var(--text); width: 32px; height: 32px; border-radius: 50%; font-size: 16px; }
  .notes { background: color-mix(in srgb, var(--warn) 12%, transparent); border-radius: 10px; padding: 10px; font-size: 13px; margin-top: 8px; }
  .period { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .period select { background: var(--bg); font-size: 14px; padding: 8px; }
  .toast { background: #2b323d; }
  .rep td { padding: 6px 3px; }
  .rep td:first-child { width: 46%; }
  .rep tr.g td { font-weight: 700; border-top: 2px solid var(--line); }
  .rep tr.h td { font-size: 12px; color: var(--hint); text-transform: uppercase; letter-spacing: .03em; border-top: 0; padding-top: 14px; }
  .rep tr.sub td:first-child { padding-left: 12px; }
  .over { color: var(--bad); } .under { color: var(--ok); }
  .dv { font-size: 11px; font-weight: 500; margin-top: 2px; }
  .rep td { word-break: normal; }
  .rep { font-size: 12px; }
  .rep td.n { font-size: 11.5px; padding-left: 2px; padding-right: 2px; }
  .rep .dv { font-size: 10px; }
  .rep td:first-child { width: auto; }
  .kv { display: flex; justify-content: space-between; padding: 6px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .kv:first-child { border-top: 0; }
  .alert { display: flex; justify-content: space-between; gap: 8px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .alert:first-child { border-top: 0; }
  .kv b, .alert b { white-space: nowrap; }
  .hero .kv { border-color: color-mix(in srgb, var(--accent-text) 25%, transparent); }
  .refresh { position: fixed; top: calc(var(--tg-safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px) + 6px); left: 50%; transform: translateX(-50%); background: #2b323d; color: #cfd6e0; font-size: 12px; padding: 4px 12px; border-radius: 10px; z-index: 9; opacity: .92; pointer-events: none; }
  .photos .muted.wait { padding: 10px 0; }
  .tg { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .arr { display: inline-block; width: 13px; color: var(--hint); font-size: 11px; }
  .rep tr.sub2 td:first-child { padding-left: 26px; color: var(--hint); }
  .rep tr.sub2 td { font-size: 11px; }
  h2.blk { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  h2.blk .bsum { font-size: 13px; font-weight: 600; color: var(--hint); white-space: nowrap; }
  .chips.mode { align-items: center; }
  .sb { display: flex; align-items: flex-end; gap: 3px; height: 150px; padding: 4px 0 0; border-bottom: 1px solid var(--line); }
  .sb .c { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column-reverse; position: relative; cursor: pointer; }
  .sb .c i { display: block; width: 100%; }
  .sb .c i:last-of-type { border-radius: 3px 3px 0 0; }
  .sb .c.on { outline: 1px solid var(--hint); outline-offset: 1px; border-radius: 3px; }
  .sb .t { position: absolute; left: -2px; right: -2px; border-top: 2px dashed var(--hint); }
  .sbl { display: flex; gap: 3px; font-size: 10px; color: var(--hint); margin-top: 3px; }
  .sbl span { flex: 1; min-width: 0; text-align: center; overflow: visible; white-space: nowrap; display: flex; justify-content: center; }
  .lg { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--hint); margin: 6px 0; }
  .lg span::before { content: ''; display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; background: var(--c); vertical-align: -1px; }
  .hatch { background: repeating-linear-gradient(45deg, #e34948 0 3px, #f7c1c1 3px 6px) !important; }
  .hm { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; font-size: 10px; color: var(--hint); text-align: center; }
  .hm i { font-style: normal; height: 30px; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--text); cursor: pointer; }
  .hm i.fut { background: transparent; border: 1px dashed var(--line); color: var(--hint); cursor: default; }
  .sbar { display: flex; gap: 2px; height: 24px; margin: 8px 0 6px; }
  .sbar i { display: flex; align-items: center; justify-content: center; border-radius: 5px; font-size: 11px; font-style: normal; font-weight: 700; color: #10151a; min-width: 3px; }
  .pf { position: relative; height: 8px; background: var(--bg2); border-radius: 4px; margin: 3px 0 8px; }
  .pf i { position: absolute; left: 0; top: 0; height: 8px; border-radius: 4px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 7px; }
  .pf u { position: absolute; top: -3px; width: 2px; height: 14px; background: var(--text); }
  /* Светлая тема: включается, когда в Telegram светлая тема. Блоки те же, меняются только цвета */
  html.light {
    --bg: #ffffff; --bg2: #eceef1; --field: #e9ebef; --text: #0e1116; --hint: #545b66;
    --accent: #0f8a7d; --accent-text: #ffffff; --gold: #9a6c00; --ok: #17864a; --warn: #a96800; --bad: #d23a40;
    --line: rgba(30, 35, 45, .14);
  }
  html.light body { -webkit-font-smoothing: auto; }
  html.light .card { box-shadow: 0 1px 3px rgba(20, 25, 35, .08); border: 1px solid #dde0e5; }
  html.light input[type="checkbox"] { accent-color: var(--accent); }
  html.light .hero { border: 0; color: #fff; }
  html.light .hero .big { color: #fff; }
  html.light input, html.light select, html.light textarea { color-scheme: light; }
  html.light nav { background: #ffffff; }
  html.light .sb .c.on { outline-color: var(--text); }
</style>
</head>
<body>
<main id="app"><div class="center"><div class="spin"></div>Загрузка…</div></main>
<nav id="nav" hidden>
  <button data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 13h6V4H4zM14 20h6v-9h-6zM14 4v4h6V4zM4 20h6v-3H4z"/></svg>Сводка</button>
  <button data-tab="docs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/></svg>Документы</button>
  <button data-tab="an" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l2.2 5.3L20 9l-4.4 3.8L17 19l-5-3-5 3 1.4-6.2L4 9l5.8-.7z"/></svg>Аналитика</button>
  <button data-tab="buy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 4h2l2.4 11h11.2L21 7H6.2"/><circle cx="9" cy="19.5" r="1.5"/><circle cx="18" cy="19.5" r="1.5"/></svg>Закупка</button>
  <button data-tab="personal" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h15a3 3 0 0 1 3 3v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 7l12-4v4M16 14h2"/></svg>Личное</button>
  <button data-tab="reports" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Отчёты</button>
</nav>
<script>
// ====== Вставьте сюда адрес веб-приложения Google Apps Script (заканчивается на /exec) ======
const API_URL = 'https://script.google.com/macros/s/AKfycbw6juK8GHilzHdv2zN4VE6syBlK4Ad8gndfmeKLixjNZKyNXYgBErm-WC1HYq_ELZE4kQ/exec';
// ==========================================================================================

const tg = window.Telegram && window.Telegram.WebApp;
const $app = document.getElementById('app');
const $nav = document.getElementById('nav');
let ME = null, TAB = 'home', DOCFILTER = 'На проверке', MONTH = monthNow(), PENDING_FILES = [], CUR = null;
let CLIENT = new URLSearchParams(location.search).get('client') || localStorage.getItem('client') || '';

const STATUS_CLASS = { 'На проверке': 'b-wait', 'Утверждён': 'b-ok', 'Отклонён': 'b-no', 'Ошибка распознавания': 'b-err' };
const MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];

function monthNow() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function money(n) { const v = Math.round((Number(n) || 0) * 100) / 100; const [i, f] = Math.abs(v).toFixed(2).split('.'); return (v < 0 ? '-' : '') + i.replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + (f === '00' ? '' : ',' + f) + ' ₸'; }
function badge(s) { return `<span class="badge ${STATUS_CLASS[s] || 'b-wait'}">${esc(s)}</span>`; }
function checkClass(c) { return /^Сумма сходится/.test(c || '') && !/не найдены/.test(c || '') ? 'check-ok' : 'check-bad'; }
function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 3500); }
function haptic(type) { try { tg.HapticFeedback.notificationOccurred(type); } catch (e) {} }
function loading(text) { $app.innerHTML = `<div class="center"><div class="spin"></div>${esc(text || 'Загрузка…')}</div>`; }

async function api(action, data) {
  const res = await fetch(API_URL, {
    method: 'POST',
    body: JSON.stringify(Object.assign({ action, initData: tg ? tg.initData : '', client: CLIENT }, data || {})),
  });
  const j = await res.json();
  if (j.error === 'no_access') { showNoAccess(j); throw new Error('no_access'); }
  if (j.error) throw new Error(j.error);
  return j;
}

// ====== Запоминание на телефоне: сразу показываем то, что видели в прошлый раз, свежее подгружаем ======
const UID = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id) || '';
const CK = 'fa1:';
function ckey(action, data) { return CK + UID + ':' + CLIENT + ':' + action + ':' + JSON.stringify(data || {}); }
function cget(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
function cput(k, v) {
  const s = JSON.stringify(v);
  for (let t = 0; t < 2; t++) {
    try {
      localStorage.setItem(k, s);
      const idx = (cget(CK + 'idx') || []).filter(x => x !== k); idx.push(k);
      while (idx.length > 40) localStorage.removeItem(idx.shift());   // храним не больше 40 страниц
      localStorage.setItem(CK + 'idx', JSON.stringify(idx));
      return;
    } catch (e) { Object.keys(localStorage).filter(x => x.indexOf(CK) === 0).forEach(x => localStorage.removeItem(x)); }
  }
}
let BUSY = 0;
function refreshing(on) {
  BUSY = Math.max(0, BUSY + (on ? 1 : -1));
  let el = document.getElementById('refresh');
  if (BUSY && !el) { el = document.createElement('div'); el.id = 'refresh'; el.className = 'refresh'; el.textContent = 'обновляю…'; document.body.appendChild(el); }
  if (!BUSY && el) el.remove();
}
// o.draw(data) рисует; o.alive() = пользователь ещё на этой странице; o.wait() = крутилка, если прошлых данных нет; o.fail(e)
async function load(action, data, o) {
  const k = ckey(action, data), old = cget(k);
  if (old) { if (o.alive()) o.draw(old); refreshing(true); }
  else if (o.wait) o.wait();
  try {
    const fresh = await api(action, data);
    cput(k, fresh);
    if (!o.alive()) return;
    if (!old || JSON.stringify(old) !== JSON.stringify(fresh)) { const y = window.scrollY; o.draw(fresh); if (old) window.scrollTo(0, y); }
  } catch (e) {
    if (e.message === 'no_access' || !o.alive()) return;
    if (old) toast('Не удалось обновить: ' + e.message); else o.fail(e);
  } finally { if (old) refreshing(false); }
}
function failCard(e) { $app.innerHTML = `<div class="card">${esc(e.message)}</div>`; }
// Утверждённые и отклонённые в этом сеансе: на экране меняем сразу, не дожидаясь Google
const OVR = {};
function withOvr(docs, filter) {
  return docs.map(d => OVR[d.id] ? Object.assign({}, d, { status: OVR[d.id] }) : d)
    .filter(d => !filter || filter === 'Все' || d.status === filter);
}

function showNoAccess(j) {
  $nav.hidden = true;
  $app.innerHTML = `<div class="card center"><h1>Нет доступа</h1><p>Передайте этот номер бухгалтеру, вас добавят в список сотрудников.</p><p class="big">${esc(j.telegramId)}</p></div>`;
}

// «Документы / Закупка» одной кнопкой внизу (у кого есть «Аналитика»)
function docBuyChips(on) {
  return ME.user.personal ? `<div class="chips seg">${[['docs', 'Документы'], ['buy', 'Закупка']].map(([k, t]) => `<button class="chip ${k === on ? 'on' : ''}" data-dbuy="${k}">${t}</button>`).join('')}</div>` : '';
}
$app.addEventListener('click', e => {
  const b = e.target.closest('[data-dbuy]'); if (b && b.dataset.dbuy !== TAB) go(b.dataset.dbuy);
  const a = e.target.closest('[data-anv]'); if (a) { ANV = a.dataset.anv; renderAn(); window.scrollTo(0, 0); }
});

// ====== Навигация ======
$nav.addEventListener('click', e => { const b = e.target.closest('button'); if (b) go(b.dataset.tab); });
function go(tab) {
  TAB = tab; CUR = null;
  const navTab = tab === 'upload' || tab === 'manual' || (tab === 'buy' && $nav.querySelector('[data-tab="buy"]').hidden) ? 'docs' : tab;
  [...$nav.children].forEach(b => b.classList.toggle('on', b.dataset.tab === navTab));
  if (tg) tg.BackButton.hide();
  if (tab === 'home') renderHome();
  if (tab === 'upload') { renderUpload(); if (tg) tg.BackButton.show(); }
  if (tab === 'manual') { renderManual(); if (tg) tg.BackButton.show(); }
  if (tab === 'docs') renderDocs();
  if (tab === 'reports') { REP = null; DAYDATA = null; renderReports(); }   // прошлые цифры сразу, свежие следом
  if (tab === 'buy') renderBuy();
  if (tab === 'personal') renderPersonal();
  if (tab === 'an') renderAn();
  window.scrollTo(0, 0);
}

// ====== Отчёты: ОПиУ, план-факт, ЗП собственницы, ДДС, рассрочки ======
let REP = null, PFROM = '', PTO = '';
const MSHORT = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
function mLabel(k) { const [y, m] = k.split('-'); return MSHORT[Number(m) - 1] + ' ' + y; }
function mDiff(a, b) { const [ay, am] = a.split('-').map(Number), [by, bm] = b.split('-').map(Number); return (by - ay) * 12 + (bm - am); }
function tg0(n) { return money(Math.round(n || 0)); }
function nb(n) { return money(Math.round(n || 0)).replace(' ₸', ''); }
function pct(a, b) { return b ? Math.round((a - b) / Math.abs(b) * 100) : null; }

async function renderReports() {
  if (REP) return drawRepView();
  return load('reports', {}, {
    wait: () => loading('Загружаю отчёты…'),
    alive: () => TAB === 'reports',
    fail: failCard,
    draw: data => {
      REP = data;
      if (REP.months.length && !(REP.months.includes(PFROM) && REP.months.includes(PTO))) PFROM = PTO = REP.factTo || REP.months[REP.months.length - 1];
      drawRepView();
    },
  });
}
function drawRepView() {
  if (!REP.months.length) { $app.innerHTML = '<div class="card muted">Отчётов пока нет. Их добавляет бухгалтер после обновления модели.</div>'; return; }
  if (!REPVIEW) REPVIEW = ME.user.admin ? 'fin' : 'main';
  if (REPVIEW === 'main') drawMain();
  else if (REPVIEW === 'staff') drawStaff();
  else if (REPVIEW === 'days') renderDays();
  else if (REPVIEW === 'years') drawYears();
  else drawReports();
}

function sumRange(arr, idx) { let s = 0, any = false; idx.forEach(i => { if (arr[i] !== null && arr[i] !== undefined) { s += arr[i]; any = true; } }); return any ? s : null; }

// ---------- Свернуть / раскрыть (запоминается на этом телефоне, у каждого своё) ----------
let RMODE = null, TGL = new Set(), BLK = new Set();
function openKey() { return CK + UID + ':open'; }
function loadOpen() {
  if (RMODE) return;
  let s = {};
  try { s = JSON.parse(localStorage.getItem(openKey()) || '{}'); } catch (e) {}
  RMODE = s.mode || (ME.user.admin ? 'full' : 'short');   // Арайлым подробно, остальные кратко
  TGL = new Set(s.tgl || []); BLK = new Set(s.blk || []);
}
function saveOpen() { try { localStorage.setItem(openKey(), JSON.stringify({ mode: RMODE, tgl: [...TGL], blk: [...BLK] })); } catch (e) {} }
function isOpen(k) { return (RMODE === 'full') !== TGL.has(k); }
function arrow(open) { return `<span class="arr">${open ? '▾' : '▸'}</span>`; }
function bindToggles(redraw) {
  const again = () => { const y = window.scrollY; redraw(); window.scrollTo(0, y); };
  $app.querySelectorAll('[data-tg]').forEach(el => el.onclick = () => { const k = el.dataset.tg; TGL.has(k) ? TGL.delete(k) : TGL.add(k); saveOpen(); again(); });
  $app.querySelectorAll('[data-blk]').forEach(el => el.onclick = () => { const k = el.dataset.blk; BLK.has(k) ? BLK.delete(k) : BLK.add(k); saveOpen(); again(); });
  $app.querySelectorAll('[data-mode]').forEach(el => el.onclick = () => { RMODE = el.dataset.mode; TGL.clear(); saveOpen(); again(); });
}
function block(key, title, summary, body) {
  const open = !BLK.has(key);
  return `<h2 class="tg blk" data-blk="${key}"><span>${arrow(open)}${title}</span>${open ? '' : `<span class="bsum">${summary}</span>`}</h2>${open ? body : ''}`;
}

// ---------- Расчёт ОПиУ за выбранные месяцы ----------
function plCalc(R, idx) {
  const pl = R.lines.filter(l => l.sec === 'ОПиУ');
  const factIdx = idx.filter(i => pl.some(l => l.fact[i] !== null));
  const hasFact = factIdx.length > 0, cmpIdx = hasFact ? factIdx : idx;
  const val = (l, kind) => sumRange(kind === 'f' ? l.fact : l.plan, kind === 'f' ? factIdx : cmpIdx) || 0;
  const tot = (kind, grp) => pl.filter(l => l.grp === grp).reduce((s, l) => s + val(l, kind), 0);
  const own = R.lines.filter(l => l.sec === 'Собственница');
  const calc = kind => {
    const rev = tot(kind, 'Выручка'), vr = tot(kind, 'Переменные'), fx = tot(kind, 'Постоянные'), bt = tot(kind, 'Амортизация и налог');
    const get = g => own.filter(l => l.grp === g).reduce((s, l) => s + val(l, kind), 0);
    const net = rev - vr - fx - bt, zp = get('ЗП'), adj = get('Поправки');
    return { rev, vr, fx, bt, ebitda: rev - vr - fx, net, zp, adj, norm: net - zp - adj, ownServ: get('Услуги') };
  };
  const F = calc('f'), P = calc('p');
  // что вышло за план
  const alerts = [];
  if (hasFact) pl.forEach(l => {
    const f = val(l, 'f'), p = val(l, 'p'), d = f - p;
    if (l.grp === 'Выручка') { if (p > 0 && d < -Math.max(20000, p * 0.05)) alerts.push({ t: l.name + ': ниже плана', d }); }
    else if (l.name === 'Расходники и материалы') return;   // в ОПиУ по норме от услуг, следим за закупками ниже
    else if (l.grp !== 'Амортизация и налог' && d > Math.max(10000, p * 0.1)) alerts.push({ t: l.name, d });
  });
  // Закупки расходников (ДДС, по оплате) за 3 последних месяца с фактом против нормы в ОПиУ: больше на 20% = закупили впрок или тратят больше нормы
  const lastF = factIdx[factIdx.length - 1];
  if (lastF !== undefined) {
    const k3 = [lastF - 2, lastF - 1, lastF].filter(i => i >= 0 && pl.some(l => l.fact[i] !== null));
    const buy = R.lines.find(l => l.sec === 'ДДС' && l.name === 'Расходники и материалы'), norm = pl.find(l => l.name === 'Расходники и материалы');
    if (buy && norm && k3.length) {
      const b = sumRange(buy.fact, k3) || 0, n = sumRange(norm.fact, k3) || 0;
      if (n && b > n * 1.2) alerts.push({ t: 'Закупки расходников за 3 мес. больше нормы', d: b - n });
    }
  }
  // Меруерт сделала меньше услуг, чем по плану (её клиентов взяли наёмные или клиентов меньше)
  const ownL = own.find(l => l.grp === 'Услуги');
  if (hasFact && ownL) {
    const f = sumRange(ownL.fact, factIdx) || 0, p = sumRange(ownL.plan, factIdx) || 0;
    if (p && f < p - Math.max(50000, p * 0.05)) alerts.push({ t: 'Услуги Меруерт: ниже плана', d: f - p });
  }
  alerts.sort((a, b) => Math.abs(b.d) - Math.abs(a.d));
  return { pl, factIdx, hasFact, val, F, P, alerts };
}

// ЗП мастеров по именам: выплачено (журнал) и положено (их услуги × ставка). Разница со строкой ОПиУ = «прочее».
function zpPeople(R, line, X) {
  if (!/подолог|мастер/i.test(line.name)) return null;
  const rules = R.staff || [], sl = R.lines.filter(l => l.sec === 'Сотрудники');
  // выплаты по имени: из раздела «Сотрудники», а если его нет, из ДДС («ЗП подолога: Жанель»)
  const ddsPaid = {};
  R.lines.filter(l => l.sec === 'ДДС' && /^ЗП (подолога|мастера):/i.test(l.name)).forEach(l => { ddsPaid[l.name.split(':')[1].trim()] = l; });
  const people = [...new Set(sl.map(l => l.grp).concat(Object.keys(ddsPaid)))].filter(n => {
    const r = rules.filter(x => x.name === n).slice(-1)[0];
    return r ? !/собствен|админ/i.test(r.role) : !!ddsPaid[n];
  });
  const rows = people.map(n => {
    const paid = sl.find(l => l.grp === n && l.name === 'Выплачено') || ddsPaid[n], serv = sl.find(l => l.grp === n && l.name === 'Услуги');
    const f = paid ? (sumRange(paid.fact, X.factIdx) || 0) : 0;
    let p = 0;
    X.factIdx.forEach(i => { const r = ruleFor(rules, n, R.months[i]); if (r && serv) p += (serv.fact[i] || 0) * r.pct / 100; });
    return { n, f: Math.round(f), p: Math.round(p) };
  }).filter(x => x.f || x.p).sort((a, b) => b.f - a.f);
  if (!rows.length) return null;
  const hasPlan = rows.some(x => x.p);
  if (!hasPlan) rows.forEach(x => { x.p = null; });   // услуг по именам нет: план по людям не показываем
  const rf = X.val(line, 'f') - rows.reduce((s, x) => s + x.f, 0), rp = hasPlan ? X.val(line, 'p') - rows.reduce((s, x) => s + x.p, 0) : 0;
  if (Math.abs(rf) >= 1 || Math.abs(rp) >= 1) rows.push({ n: 'Прочее (вне журнала, округления)', f: rf, p: rp });
  return rows;
}

function loansCalc(R) {
  const now = R.today || monthNow();
  const loans = R.loans.map(x => {
    const paid = Math.max(0, Math.min(x.count, x.first ? mDiff(x.first, now) + 1 : 0));
    const left = Math.max(0, x.sum - paid * x.pay);
    const lastM = x.first ? (() => { let k = x.first; for (let i = 1; i < x.count; i++) k = shiftMonth(k, 1); return k; })() : '';
    return Object.assign({ paid, left, lastM }, x);
  });
  return { loans, left: loans.reduce((s, x) => s + x.left, 0), pay: loans.filter(x => x.left > 0).reduce((s, x) => s + x.pay, 0) };
}

function drawReports() {
  loadOpen();
  const R = REP, ms = R.months;
  const idx = ms.map((m, i) => i).filter(i => ms[i] >= PFROM && ms[i] <= PTO);
  const X = plCalc(R, idx), { pl, factIdx, hasFact, val, F, P, alerts } = X;
  const opts = ms.map(m => `<option value="${m}">${mLabel(m)}${m > (R.factTo || '') ? ' (план)' : ''}</option>`).join('');
  const lastQ = ms.filter(m => m <= R.factTo).slice(-3);
  const yearOf = m => m.slice(0, 4);
  const dev = (f, p, isRev) => {
    if (!hasFact || !p) return '';
    const d = f - p, k = pct(f, p);
    const bad = isRev ? d < 0 : d > 0;
    if (Math.abs(d) < 1) return '<span class="muted">0</span>';
    return `<span class="${bad ? 'over' : 'under'}">${d > 0 ? '+' : ''}${tg0(d)}${k !== null ? ' (' + (k > 0 ? '+' : '') + k + '%)' : ''}</span>`;
  };
  const devS = (f, p, isRev) => {
    if (!hasFact || !p) return '';
    const d = f - p, k = pct(f, p);
    if (Math.abs(d) < 1) return '';
    const bad = isRev ? d < 0 : d > 0;
    return `<span class="${bad ? 'over' : 'under'}">${d > 0 ? '+' : ''}${nb(d)}${k !== null ? `<div class="dv">${k > 0 ? '+' : ''}${k}%</div>` : ''}</span>`;
  };
  // строка таблицы; tg = ключ, если строку можно раскрыть
  const row = (name, f, p, cls, isRev, tg, note) => `<tr class="${cls || ''}${tg ? ' tg' : ''}" ${tg ? `data-tg="${tg}"` : ''}><td>${tg ? arrow(isOpen(tg)) : ''}${esc(name)}${note ? `<div class="dv muted" style="font-weight:400">${esc(note)}</div>` : ''}</td><td class="n">${hasFact ? nb(f) : ''}</td><td class="n muted">${p === null ? '' : nb(p)}</td><td class="n">${p === null ? '' : devS(f, p, isRev)}</td></tr>`;
  const subs = grp => pl.filter(l => l.grp === grp).sort((a, b) => a.order - b.order).filter(l => Math.abs(val(l, 'f')) + Math.abs(val(l, 'p')) > 0);
  const grpBlock = (grp, title, f, p, isRev) => {
    const k = 'g:' + grp;
    if (!isOpen(k)) return row(title, f, p, 'g', isRev, k);
    return row(title, f, p, 'g', isRev, k) + subs(grp).map(l => {
      const zp = zpPeople(R, l, X);
      if (!zp) return row(l.name, val(l, 'f'), val(l, 'p'), 'sub', isRev);
      const kz = 'z:' + l.name;
      return row(l.name, val(l, 'f'), val(l, 'p'), 'sub', isRev, kz) + (isOpen(kz) ? zp.map(z => row(z.n, z.f, z.p, 'sub2', isRev)).join('') : '');
    }).join('');
  };
  // ДДС
  const dl = R.lines.filter(l => l.sec === 'ДДС');
  // только закрытые месяцы: строки текущего месяца по выпискам (Kaspi Pay, Halyk) живут в карточке «месяц по сегодня»
  const dIdx = idx.filter(i => R.months[i] <= R.factTo && dl.some(l => l.fact[i] !== null && l.grp !== 'Остаток на начало' && l.grp !== 'Остаток на конец'));
  const dv = l => sumRange(l.fact, dIdx) || 0;
  const dGrp = g => dl.filter(l => l.grp === g && Math.abs(dv(l)) > 0).sort((a, b) => a.order - b.order);
  const dSum = g => dGrp(g).reduce((s, l) => s + dv(l), 0);
  const startL = dl.find(l => l.grp === 'Остаток на начало'), endL = dl.find(l => l.grp === 'Остаток на конец');
  const endSum = endL && dIdx.length ? endL.fact[dIdx[dIdx.length - 1]] : 0;
  const dBlock = (grp, title) => {
    const items = dGrp(grp);
    if (!items.length) return '';
    const k = 'd:' + grp, open = isOpen(k);
    const line = (l, pad) => `<tr class="sub"><td${pad ? ' style="padding-left:28px"' : ''}>${esc(l.name)}</td><td class="n">${tg0(dv(l))}</td></tr>`;
    let body = items.map(l => line(l)).join('');
    if (grp === 'Поступления') {
      // услуги одной строкой с итогом (раскрывается по видам), товары и прочее отдельно
      const notServ = l => /товар|прочие поступления|по выписке|терминал/i.test(l.name);
      const serv = items.filter(l => !notServ(l)), rest = items.filter(notServ), ks = 'd:serv', os = isOpen(ks);
      body = (serv.length ? `<tr class="sub tg" data-tg="${ks}"><td>${arrow(os)}<b>Услуги</b></td><td class="n"><b>${tg0(serv.reduce((a, l) => a + dv(l), 0))}</b></td></tr>`
        + (os ? serv.map(l => line(l, true)).join('') : '') : '') + rest.map(l => line(l)).join('');
    }
    return `<tr class="g tg" data-tg="${k}"><td>${arrow(open)}${title}</td><td class="n">${tg0(dSum(grp))}</td></tr>` + (open ? body : '');
  };
  const ddsHtml = dIdx.length ? `
    <table class="rep"><tbody>
      <tr class="g"><td>Остаток на начало</td><td class="n">${tg0(startL ? startL.fact[dIdx[0]] : 0)}</td></tr>
      ${dBlock('Поступления', 'Принятые оплаты (поступления)')}
      ${dBlock('Выплаты', 'Выплаты')}
      ${dBlock('Инвестиции', 'Оборудование')}
      ${dBlock('Финансы', 'Кредиты и собственница')}
      <tr class="g"><td>Остаток на конец</td><td class="n">${tg0(endSum)}</td></tr>
    </tbody></table>
    <div class="muted" style="margin-top:6px">Остаток это счёт Kaspi Pay: выручка с него каждый день уходит на карту Меруерт.</div>` : '<div class="muted">За этот период движения денег нет (будет после внесения журнала).</div>';
  const L = loansCalc(R);
  const period = PFROM === PTO ? mLabel(PFROM) : mLabel(PFROM) + ' - ' + mLabel(PTO);

  $app.innerHTML = `
    <h1>Отчёты · ${esc(ME.client.name)}</h1>
    ${viewChips()}
    <div class="chips">
      <button class="chip" data-q="last">Последний месяц</button>
      <button class="chip" data-q="q">3 месяца</button>
      ${[...new Set(ms.map(yearOf))].map(y => `<button class="chip" data-q="y${y}">${y} год</button>`).join('')}
    </div>
    <div class="period">
      <label class="f" style="margin:0"><span>С месяца</span><select id="pf">${opts}</select></label>
      <label class="f" style="margin:0"><span>По месяц</span><select id="pt">${opts}</select></label>
    </div>
    ${!hasFact ? `<div class="notes">За ${esc(period)} факта ещё нет, показан только план. Факт есть по ${esc(mLabel(R.factTo))}.</div>` : (idx.length > factIdx.length ? `<div class="notes">Факт есть по ${esc(mLabel(R.factTo))}. План сравнивается только за месяцы с фактом.</div>` : '')}

    <div class="grid2">
      <div class="card"><div class="muted">Выручка</div><div class="big" style="font-size:20px">${hasFact ? tg0(F.rev) : 'нет факта'}</div><div class="muted">план ${tg0(P.rev)} ${dev(F.rev, P.rev, true)}</div></div>
      <div class="card"><div class="muted">Чистая прибыль</div><div class="big" style="font-size:20px">${hasFact ? tg0(F.net) : 'нет факта'}</div><div class="muted">план ${tg0(P.net)} ${dev(F.net, P.net, true)}</div><div class="muted" style="font-size:11px">по записанным расходам, возможна погрешность</div></div>
    </div>
    <div class="card">
      <div class="kv"><span>ЗП Меруерт (35% её услуг)</span><b>${tg0(hasFact ? F.zp : P.zp)}</b></div>
      <div class="kv"><span>Прибыль центра после её ЗП</span><b class="${(hasFact ? F.norm : P.norm) < 0 ? 'over' : ''}">${tg0(hasFact ? F.norm : P.norm)}</b></div>
    </div>

    <div class="chips seg mode">
      <button class="chip ${RMODE === 'short' ? 'on' : ''}" data-mode="short">Кратко</button>
      <button class="chip ${RMODE === 'full' ? 'on' : ''}" data-mode="full">Подробно</button>
      <span class="muted" style="align-self:center;font-size:12px">▸ нажмите строку, чтобы раскрыть</span>
    </div>

    ${hasFact && F.rev > 0 ? block('where', 'Куда ушла выручка', 'прибыль ' + Math.round(F.net / F.rev * 100) + '%', (() => {
      const parts = [['Переменные', F.vr, '#ff7a6b'], ['Постоянные', F.fx, '#f0b429'], ['Налог и износ', F.bt, '#9aa0a8'], [F.net >= 0 ? 'Прибыль' : 'Убыток', Math.abs(F.net), F.net >= 0 ? 'var(--accent)' : 'var(--bad)']].filter(p => p[1] > 0);
      return `<div class="card"><div class="sbar">${parts.map(p => `<i style="flex:${p[1]};background:${p[2]}">${p[1] / F.rev > .09 ? Math.round(p[1] / F.rev * 100) + '%' : ''}</i>`).join('')}</div>
        ${parts.map(p => `<div class="kv"><span><span class="dot" style="background:${p[2]}"></span>${p[0]}</span><b>${tg0(p[1])}</b></div>`).join('')}</div>`;
    })()) : ''}

    ${hasFact ? (() => {
      const ex = pl.filter(l => l.grp !== 'Выручка' && l.grp !== 'Амортизация и налог').map(l => ({ n: l.name, f: val(l, 'f'), p: val(l, 'p') })).filter(x => x.p > 0 && x.f > 0).sort((x, y) => y.f - x.f).slice(0, 6);
      if (!ex.length) return '';
      return block('pf', 'План-факт расходов', 'черта = план', `<div class="card">${ex.map(x => {
        const m = Math.max(x.f, x.p) * 1.12, k = Math.round((x.f / x.p - 1) * 100), over = x.f > x.p * 1.05;
        return `<div class="row" style="font-size:14px"><span>${esc(x.n)}</span><b class="${over ? 'over' : 'under'}">${k > 0 ? '+' : ''}${k}%</b></div><div class="pf"><i style="width:${x.f / m * 100}%;background:${over ? '#ff7a6b' : 'var(--accent)'}"></i><u style="left:${x.p / m * 100}%"></u></div>`;
      }).join('')}<div class="muted">Полоса = факт, черта = план. Красная: больше плана на 5% и выше.</div></div>`);
    })() : ''}

    ${hasFact ? block('alerts', 'Что вышло за план', alerts.length ? alerts.length + ' ' + plural(alerts.length, 'статья', 'статьи', 'статей') : 'всё в плане',
      `<div class="card">${alerts.length ? alerts.slice(0, 8).map(a => `<div class="alert"><span>${esc(a.t)}</span><b class="over">${a.d > 0 ? '+' : ''}${tg0(a.d)}</b></div>`).join('') : '<div class="muted">Всё в пределах плана</div>'}</div>`) : ''}

    ${block('opiu', `Прибыли и убытки (ОПиУ) · ${esc(period)}`, 'прибыль ' + tg0(hasFact ? F.net : P.net), `
    <div class="card" style="padding:10px"><table class="rep"><tbody>
      <tr class="h"><td>₸</td><td class="n">Факт</td><td class="n">План</td><td class="n">Откл.</td></tr>
      ${grpBlock('Выручка', 'Выручка', F.rev, P.rev, true)}
      ${grpBlock('Переменные', 'Переменные расходы', F.vr, P.vr)}
      ${grpBlock('Постоянные', 'Постоянные расходы', F.fx, P.fx)}
      ${row('Операционная прибыль', F.ebitda, P.ebitda, 'g', true)}
      ${grpBlock('Амортизация и налог', 'Налог и износ оборудования', F.bt, P.bt)}
      ${row('Чистая прибыль', F.net, P.net, 'g', true)}

// Положено: % от своих услуг (Altegio, мастер ищется по первому слову имени) + оклад и таргет за прошедшие рабочие дни
// + бонус % от услуг центра. Условия с листа «Сотрудники».
function payList(days, rules, m, now) {
  const serv = days.reduce((s, x) => s + x.sum, 0), byFirst = {};
  days.forEach(x => Object.entries(x.staff || {}).forEach(([n, v]) => { const k = n.trim().split(/\s+/)[0].toLowerCase(); byFirst[k] = (byFirst[k] || 0) + v.sum; }));
  return [...new Set(rules.map(r => r.name))].map(n => {
    const r = ruleFor(rules, n, m);
    if (!r || /уволен/i.test(r.note || '')) return null;
    const own = (byFirst[n.trim().split(/\s+/)[0].toLowerCase()] || 0);
    const wAll = workdays(m, r.off), o = offDays(r.off);
    let wPast = 0; for (let k = 1; k <= now.getDate(); k++) if (!o.includes(new Date(now.getFullYear(), now.getMonth(), k).getDay())) wPast++;
    const part = wAll ? wPast / wAll : 1;
    const p = own * r.pct / 100 + (r.salary + r.target) * part + serv * r.centerPct / 100;
    return p >= 1 ? { n, own, p, r } : null;
  }).filter(Boolean).sort((x, y) => y.p - x.p);
}

// ---------- Условия оплаты ----------
const WD = { 'вс': 0, 'пн': 1, 'вт': 2, 'ср': 3, 'чт': 4, 'пт': 5, 'сб': 6 };
function offDays(s) { return String(s || '').toLowerCase().split(/[,\s]+/).map(x => WD[x.slice(0, 2)]).filter(x => x !== undefined); }
function ruleFor(rules, name, month) {
  return rules.filter(r => r.name === name && r.from <= month).sort((a, b) => a.from < b.from ? 1 : -1)[0] || null;
}
function workdays(month, off) {
  const [y, m] = month.split('-').map(Number), n = new Date(y, m, 0).getDate(), o = offDays(off);
  let c = 0; for (let d = 1; d <= n; d++) if (!o.includes(new Date(y, m - 1, d).getDay())) c++;
  return c;
}
function tabelShare(tabel, name, month, off) {
  const t = (tabel || []).find(x => x.name === name && x.month === month);
  if (!t) return 1;
  const w = workdays(month, off);
  return w ? Math.min(1, t.days / w) : 1;
}

// ---------- Сотрудники: положено и выплачено по месяцам ----------
function drawStaff() {
  const R = REP, ms = R.months, rules = R.staff || [];
  const idx = ms.map((m, i) => i).filter(i => ms[i] >= PFROM && ms[i] <= PTO && ms[i] <= R.factTo);
  const opts = ms.filter(m => m <= R.factTo).map(m => `<option value="${m}">${mLabel(m)}</option>`).join('');

  const sl = R.lines.filter(l => l.sec === 'Сотрудники');
  const people = [...new Set(sl.map(l => l.grp))];
  const cards = people.map(name => {
    const serv = sl.find(l => l.grp === name && l.name === 'Услуги'), paid = sl.find(l => l.grp === name && l.name === 'Выплачено');
    let s = 0, acc = 0, sal = 0, tgt = 0, bon = 0, pd = 0, anyPaid = false, role = '', pct = 0, cpct = 0;
    idx.forEach(i => {
      const m = ms[i], r = ruleFor(rules, name, m);
      if (!r) return;
      role = r.role; pct = r.pct; cpct = r.centerPct;
      const sv = serv ? (serv.fact[i] || 0) : 0, share = tabelShare(R.tabel, name, m, r.off);
      s += sv;

        c = (center && center.fact[i] || 0) * r.centerPct / 100 * bShare;
      acc += own + a + b + c; sal += a; tgt += b; bon += c;
      if (paid && paid.fact[i] !== null) { pd += paid.fact[i]; anyPaid = true; }
    });
    if (!role) return '';
    const last = rules.filter(x => x.name === name).slice(-1)[0];
    const diff = acc - pd;
    // «без долга» или «уволен(а)» в примечании на листе «Сотрудники»: долг не показываем
    const fired = last && /уволен/i.test(last.note || '');
    const noDebt = last && (fired || /без долга/i.test(last.note || ''));
    return `<div class="card">
      <div class="row"><b>${esc(name)}</b><span class="muted">${esc(role)}${last && last.off ? ' · выходные ' + esc(last.off) : ''}</span></div>

        ${s ? `<div class="kv"><span>Услуги (Altegio)</span><b>${tg0(s)}</b></div>` : ''}

        ${tgt ? `<div class="kv"><span>Таргет</span><b>${tg0(tgt)}</b></div>` : ''}
        ${bon ? `<div class="kv"><span>Бонус ${cpct}% от услуг центра</span><b>${tg0(bon)}</b></div>` : ''}
        <div class="kv"><span><b>Положено</b></span><b class="gold">${tg0(acc)}</b></div>
        ${anyPaid ? `<div class="kv"><span>Выплачено (журнал)</span><b>${tg0(pd)}</b></div>
        ${noDebt ? `<div class="muted" style="margin-top:4px">${fired ? 'Уволена, расчёт закрыт: долг не показываем.' : 'Долг не считаем: часть записей в Altegio шла на других мастеров.'}</div>`
          : `<div class="kv"><span>${diff >= 0 ? 'Не доплачено' : 'Переплачено'}</span><b class="${Math.abs(diff) > 1000 ? 'over' : 'under'}">${tg0(Math.abs(diff))}</b></div>`}`
        : `<div class="muted" style="margin-top:4px">${/собствен/i.test(role) ? 'Выплат в журнале нет: собственница берёт из прибыли.' : 'Выплат за период в журнале нет.'}</div>`}
      </div></div>`;
  }).join('');
  $app.innerHTML = `
    <h1>Отчёты · ${esc(ME.client.name)}</h1>

      <label class="f" style="margin:0"><span>С месяца</span><select id="pf">${opts}</select></label>

    ${monthNow() > R.factTo ? `<h2>${MONTHS[new Date().getMonth()]}: месяц ещё идёт</h2><div class="muted" style="margin:-4px 6px 8px">Не входит в период выше: журнала за этот месяц ещё нет, считаем по Altegio.</div>${curMonthCard()}` : ''}
    <div class="muted" style="padding:0 6px">Условия и выходные на листе «Сотрудники», отпуска на листе «Табель» в таблице клиента. Выплаты из журнала Дианы. Мастерам процент от услуг без предоплат.</div>`;

  if (PFROM > R.factTo) PFROM = R.factTo;
  if (PTO > R.factTo) PTO = R.factTo;
  pf.value = PFROM; pt.value = PTO;
  pf.onchange = () => { PFROM = pf.value; if (PTO < PFROM) PTO = PFROM; drawStaff(); };

}

// ---------- По дням: записи Altegio ----------
let DAYPER = 'week0', DAYDATA = null, DAYOPEN = '';
const WDS = ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];
function dayRange(k) {
  const now = new Date(), d0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  if (k === 'today') return [d0, d0];
  if (k === 'yest') { const y = new Date(d0); y.setDate(y.getDate() - 1); return [y, y]; }
  if (k === 'week0' || k === 'week1') {
    const mon = new Date(d0); mon.setDate(d0.getDate() - ((d0.getDay() + 6) % 7) - (k === 'week1' ? 7 : 0));
    const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
    return [mon, sun];
  }
  const a = new Date(d0.getFullYear(), d0.getMonth() - (k === 'month1' ? 1 : 0), 1);
  return [a, new Date(a.getFullYear(), a.getMonth() + 1, 0)];

// Календарь выручки: чем ярче день, тем больше выручка
function heatCal(days, a, b) {

function kidsPlan(ref) {
  const edu = ref.filter(x => x.kind === 'Обучение' && x.from && x.count);
  const loan = ref.find(x => x.kind === 'Кредит' && /обучение/i.test(x.name));
  if (!edu.length) return null;
  const first = edu.map(x => x.from).sort()[0];
  const last = [...edu.map(x => addM(x.from, x.count - 1)), loan && loan.from ? addM(loan.from, loan.count - 1) : first].sort().pop();
  const months = monthsRange(first, last);
  const kids = [...new Set(edu.map(x => x.name.split(':')[0].trim()))];
  const cols = months.map(m => {
    const parts = [];
    kids.forEach((k, i) => {
      const its = edu.filter(x => x.name.split(':')[0].trim() === k && x.from <= m && m <= addM(x.from, x.count - 1));
      const lost = its.filter(x => /потерян/i.test(x.name)).reduce((s, x) => s + x.month, 0);
      parts.push({ v: its.reduce((s, x) => s + x.month, 0) - lost, c: KCOL[i % KCOL.length] });
      if (lost) parts.push({ v: lost, c: '#e34948', cls: 'hatch' });
    });
    // платёж: рассрочка + те, кто платит помесячно (у них нет рассрочки: Асылым)
    const monthly = edu.filter(x => !/Ердос|Еркеназ/.test(x.name) && x.from <= m && m <= addM(x.from, x.count - 1)).reduce((s, x) => s + x.month, 0);
    const pay = monthly + (loan && loan.from <= m && m <= addM(loan.from, loan.count - 1) ? loan.month : 0);
    return { parts, tick: pay, key: m, title: mLabel(m) };
  });

  const lost = edu.filter(x => /потерян/i.test(x.name)).reduce((s, x) => s + x.month * x.count, 0);
  return { months, kids, cols, sumCost, sumPay, lost, loan };
}

function attnHtml(s, t) {

  if (w) items.push(['📄 Документы на проверке', w, 'wait']);
  if (e) items.push(['⚠️ Не распознались', e, 'err']);
  if (s.low && s.low.length) items.push(['🛒 Заканчивается на складе', s.low.length, 'buy']);
  const P = ME.user.personal ? (PDATA || cget(ckey('personal', {}))) : null;
  if (P) {
    const q = (P.todo || []).filter(x => !isDone(x)).length;
    if (q) items.push(['❓ Вопросы и платежи без ответа', q, 'personal']);
    const mm = monthNow(), rows = personalRows(P), lim = {};

    Object.keys(lim).forEach(g => {
      const spent = -rows.filter(r => r.m === mm && r.sec === 'Траты' && r.grp === g).reduce((a, r) => a + r.sum, 0);
      if (spent > lim[g]) items.push([`💸 Лимит «${g}» превышен на ${tg0(spent - lim[g])}`, '', 'personal']);

  const unc = t && t.unconfirmed ? t.unconfirmed : [];

  const open = t && t.tasks ? t.tasks.filter(x => !x.done).length : 0;
  if (open) items.push(['📝 Задачи не выполнены', open, 'tasks']);
  if (!items.length) return t ? '<div class="under">Всё в порядке ✓</div>' : '<div class="muted">Проверяю…</div>';
  return items.map(([title, n, go]) => `<div class="kv doc" data-attn="${go}" style="padding:8px 0"><span>${esc(title)}</span><b>${n}${n === '' ? '' : ' ›'}</b></div>`
    + (go === 'unc' && UNC_OPEN ? uncHtml(unc) : '')).join('');
}

function shiftMonth(m, d) { let [y, mm] = m.split('-').map(Number); mm += d; if (mm < 1) { mm = 12; y--; } if (mm > 12) { mm = 1; y++; } return y + '-' + String(mm).padStart(2, '0'); }

  PENDING_FILES = [];
  document.getElementById('file').onchange = async e => {
    for (const f of e.target.files) {
      if (PENDING_FILES.length >= 6) { toast('Не больше 6 страниц'); break; }
      try { PENDING_FILES.push(await prepareFile(f)); } catch (err) { toast(err.message); }
    }

function drawThumbs() {
  const t = document.getElementById('thumbs');
  t.innerHTML = PENDING_FILES.map((f, i) => f.mime === 'application/pdf'
    ? `<div class="pdf" data-i="${i}">PDF ✕</div>`
    : `<img src="data:${f.mime};base64,${f.data}" data-i="${i}" alt="">`).join('');
  t.querySelectorAll('[data-i]').forEach(el => el.onclick = () => { PENDING_FILES.splice(Number(el.dataset.i), 1); drawThumbs(); });
  document.getElementById('send').disabled = PENDING_FILES.length === 0;
}
function prepareFile(file) {
  return new Promise((resolve, reject) => {
    if (file.type === 'application/pdf') {
      if (file.size > 8 * 1024 * 1024) return reject(new Error('PDF больше 8 МБ'));
      const r = new FileReader();
      r.onload = () => resolve({ mime: 'application/pdf', data: String(r.result).split(',')[1] });
      r.onerror = () => reject(new Error('Не удалось прочитать файл'));
      return r.readAsDataURL(file);
    }
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 2000, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve({ mime: 'image/jpeg', data: c.toDataURL('image/jpeg', 0.85).split(',')[1] });
    };
    img.onerror = () => reject(new Error('Это не фото'));
    img.src = url;
  });
}
async function sendUpload() {
  const pay = document.getElementById('pay').value, comment = document.getElementById('comment').value;
  const files = PENDING_FILES.slice();
  loading('Распознаю документ… обычно 20-60 секунд');
  try {
    const doc = await api('upload', { files, payment: pay, comment });
    haptic(doc.status === 'Ошибка распознавания' ? 'error' : 'success');
    PENDING_FILES = [];
    openDoc(doc.id);
  } catch (e) {
    if (e.message === 'no_access') return;
    haptic('error'); toast(e.message); renderUpload(); PENDING_FILES = files; drawThumbs();
  }
}

let DPER = 'all', DOFF = 0;   // период списка: неделя, месяц или всё; DOFF = сдвиг назад
function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function dm(d) { return String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0'); }
function docPeriod() {
  const now = new Date();
  if (DPER === 'week') {
    const mon = new Date(now.getFullYear(), now.getMonth(), now.getDate() - ((now.getDay() + 6) % 7) + DOFF * 7);
    const sun = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + 6);
    return { from: ymd(mon), to: ymd(sun), label: dm(mon) + '-' + dm(sun) };
  }
  if (DPER === 'month') {
    const a = new Date(now.getFullYear(), now.getMonth() + DOFF, 1), b = new Date(a.getFullYear(), a.getMonth() + 1, 0);
    return { from: ymd(a), to: ymd(b), label: MONTHS[a.getMonth()] + ' ' + a.getFullYear() };
  }
  return { from: '', to: '', label: 'за всё время' };
}

function applyMe(me) {

  ME = me;

  document.title = ME.client.name;

  $nav.querySelector('[data-tab="an"]').hidden = !ME.user.personal;

  $nav.hidden = false;

// «Кто я» и Сводка одним обращением к Google; прошлые данные показываем сразу
async function boot(docParam) {
  const meKey = CK + UID + ':me:' + CLIENT;
  const oldMe = CLIENT ? cget(meKey) : null;
  let shown = false;
  const homeTab = () => { TAB = 'home'; CUR = null; if (tg) tg.BackButton.hide(); [...$nav.children].forEach(b => b.classList.toggle('on', b.dataset.tab === 'home')); };
  if (oldMe) {
    applyMe(oldMe);
    homeTab();
    const oldS = cget(ckey('summary', { month: MONTH }));
    if (oldS) { drawHome(oldS); shown = true; refreshing(true); }
    else loading();
    if (docParam) openDoc(docParam);
  } else loading('Подключаюсь…');
  try {
    const month = MONTH;
    const r = await api('start', { month });
    applyMe(r.me);
    cput(CK + UID + ':me:' + CLIENT, r.me);
    const sKey = ckey('summary', { month });
    const same = shown && JSON.stringify(cget(sKey)) === JSON.stringify(r.summary);
    cput(sKey, r.summary);
    if (!oldMe) { homeTab(); drawHome(r.summary); if (docParam) openDoc(docParam); }
    else if (TAB === 'home' && !CUR && MONTH === month && (!same || !shown)) { const y = window.scrollY; drawHome(r.summary); window.scrollTo(0, y); }
  } catch (e) {
    if (e.message === 'no_access') return;
    if (shown) toast('Не удалось обновить: ' + e.message);
    else $app.innerHTML = `<div class="card">Не удалось подключиться: ${esc(e.message)}</div>`;
  } finally { if (shown) refreshing(false); }
}
async function switchClient(code) {
  CLIENT = code;
  await boot();
}

// Выбор пользователя хранится на телефоне: 'tg' (как в Telegram), 'dark', 'light'
function themePref() { try { return localStorage.getItem('aray_theme') || 'tg'; } catch (e) { return 'tg'; } }
function setThemePref(v) { try { localStorage.setItem('aray_theme', v); } catch (e) {} applyTheme(); }
function themeChips() {
  const p = themePref();
  return `<h2>Тема</h2><div class="chips">${[['tg', 'Как в Telegram'], ['dark', 'Темная'], ['light', 'Светлая']]
    .map(([k, t]) => `<button class="chip ${k === p ? 'on' : ''}" data-theme="${k}">${t}</button>`).join('')}</div>`;
}
function applyTheme() {
  const q = new URLSearchParams(location.search).get('theme'), p = themePref();
  const light = q ? q === 'light' : p === 'tg' ? !!(tg && tg.colorScheme === 'light') : p === 'light';
  document.documentElement.classList.toggle('light', light);
  const bg = light ? '#eceef1' : '#0f1216', bar = light ? '#ffffff' : '#1a1e25';
  if (tg) {
    try { tg.setHeaderColor(bg); tg.setBackgroundColor(bg); } catch (e) {}
    try { if (tg.setBottomBarColor) tg.setBottomBarColor(bar); } catch (e) {}
  }
}

// ====== Запуск ======
async function start() {
  if (tg) {
    tg.ready(); tg.expand();
    tg.BackButton.onClick(() => go(TAB === 'upload' || TAB === 'manual' ? 'docs' : TAB));
    applyTheme();
    try { tg.onEvent('themeChanged', applyTheme); } catch (e) {}
    // На телефоне: на весь экран, как в видео (Telegram 8.0 и новее). Свайп вниз не закрывает приложение.
    const mobile = ['ios', 'android', 'android_x'].includes(tg.platform);
    try { if (mobile && tg.isVersionAtLeast && tg.isVersionAtLeast('8.0') && tg.requestFullscreen) tg.requestFullscreen(); } catch (e) {}
    try { if (tg.isVersionAtLeast && tg.isVersionAtLeast('7.7') && tg.disableVerticalSwipes) tg.disableVerticalSwipes(); } catch (e) {}
  }
  if (!tg || !tg.initData) {
    $app.innerHTML = '<div class="card center"><h1>Финансы с Арайлым</h1><p>Откройте приложение через бота в Telegram.</p></div>';
    return;
  }
  await boot(new URLSearchParams(location.search).get('doc'));
}
start();
</script>
