<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Финансы с Арайлым</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Свой вид «Финансы с Арайлым»: один и тот же в светлой и тёмной теме Telegram */
  :root {
    --bg: #1a1e25;          /* карточки */
    --bg2: #0f1216;         /* фон страницы */
    --field: #242a33;       /* поля ввода */
    --text: #f2f4f6;
    --hint: #8f97a3;
    --accent: #2fd1b2;      /* бирюзовый */
    --accent-text: #08201b;
    --gold: #f4c542;        /* акцент для главных цифр */
    --ok: #3ccf7f;
    --warn: #f0a92e;
    --bad: #ff6b6b;
    --line: rgba(143, 151, 163, .18);
    --radius: 18px;
    --top: calc(var(--tg-safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px));
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg2); color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  main { padding: calc(var(--top) + 12px) 12px 96px; max-width: 640px; margin: 0 auto; }
  .hero .big { color: #062019; }
  .gold { color: var(--gold); }
  .stock .big { color: var(--gold); }
  .qa { border: 0; width: 40px; height: 40px; border-radius: 12px; background: color-mix(in srgb, var(--ok) 20%, transparent); color: var(--ok); font-size: 20px; font-weight: 700; flex: 0 0 auto; }
  .qa:disabled { opacity: .4; }
  .docrow { display: flex; gap: 10px; align-items: center; }
  .docrow .card { flex: 1; margin-bottom: 0; min-width: 0; }
  .doc .row > * { min-width: 0; overflow-wrap: anywhere; }
  html, body { overflow-x: hidden; }
  .dlist > * + * { margin-top: 8px; }
  h1 { font-size: 20px; margin: 4px 4px 12px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--hint); margin: 18px 6px 8px; font-weight: 600; }
  .card { background: var(--bg); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .muted { color: var(--hint); font-size: 13px; }
  .big { font-size: 28px; font-weight: 700; letter-spacing: -.01em; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .hero { background: linear-gradient(135deg, #2fd1b2 0%, #17a58b 100%); color: var(--accent-text); }
  .hero .muted { color: color-mix(in srgb, var(--accent-text) 80%, transparent); }
  .bar { height: 6px; border-radius: 3px; background: var(--bg2); overflow: hidden; margin-top: 6px; }
  .bar > i { display: block; height: 100%; background: var(--accent); }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .b-wait { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
  .b-ok { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
  .b-no, .b-err { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }
  .check-ok { color: var(--ok); } .check-bad { color: var(--bad); }
  .doc { cursor: pointer; }
  .doc + .doc { margin-top: -2px; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 0 2px 8px; }
  .chip { border: 0; background: var(--bg); color: var(--text); padding: 7px 12px; border-radius: 99px; font: inherit; font-size: 14px; white-space: nowrap; }
  .chip.on { background: var(--accent); color: var(--accent-text); }
  button.btn { border: 0; width: 100%; padding: 13px; border-radius: 12px; font: inherit; font-weight: 600; background: var(--accent); color: var(--accent-text); }
  button.btn.sec { background: var(--field); color: var(--text); }
  button.btn.ok { background: var(--ok); } button.btn.bad { background: var(--bad); }
  button.btn:disabled { opacity: .5; }
  .btns { display: grid; gap: 8px; margin-top: 10px; }
  .btns.two { grid-template-columns: 1fr 1fr; }
  label.f { display: block; margin-bottom: 10px; }
  label.f span { display: block; font-size: 12px; color: var(--hint); margin: 0 0 4px 2px; }
  input, select, textarea { width: 100%; font: inherit; color: var(--text); background: var(--field); border: 1px solid transparent; border-radius: 10px; padding: 10px; color-scheme: dark; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
  textarea { min-height: 60px; resize: vertical; }
  .thumbs { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
  .thumbs img, .thumbs .pdf { width: 76px; height: 96px; object-fit: cover; border-radius: 10px; background: var(--bg2); display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--hint); }
  main > .btns .btn.sec, main > .btns input { background: var(--bg); }
  .row h1 { font-size: 18px; white-space: nowrap; }
  .monthsw b { white-space: nowrap; font-size: 14px; }
  .drop { display: block; cursor: pointer; border: 2px dashed var(--line); border-radius: var(--radius); padding: 22px; text-align: center; color: var(--hint); }
  .drop b { color: var(--accent); display: block; font-size: 16px; margin-bottom: 4px; }
  .photos { display: flex; gap: 8px; overflow-x: auto; }
  .photos img { height: 220px; border-radius: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td { padding: 8px 4px; border-top: 1px solid var(--line); vertical-align: top; }
  td.n { text-align: right; white-space: nowrap; }
  .alt { font-size: 12px; } .alt.yes { color: var(--ok); } .alt.no { color: var(--hint); }
  nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg); display: flex; border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  nav button { flex: 1; border: 0; background: none; color: var(--hint); padding: 9px 0 10px; font: inherit; font-size: 12px; }
  nav button svg { display: block; margin: 0 auto 2px; width: 24px; height: 24px; }
  nav button.on { color: var(--accent); }
  .center { text-align: center; padding: 40px 10px; color: var(--hint); }
  .spin { width: 28px; height: 28px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: s 0.8s linear infinite; margin: 0 auto 10px; }
  @keyframes s { to { transform: rotate(360deg); } }
  .toast { position: fixed; left: 12px; right: 12px; bottom: 80px; background: #222; color: #fff; padding: 12px 14px; border-radius: 12px; font-size: 14px; z-index: 9; }
  .lowitem { display: flex; justify-content: space-between; padding: 6px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .lowitem:first-child { border-top: 0; }
  .monthsw { display: flex; align-items: center; gap: 6px; }
  .monthsw button { border: 0; background: var(--bg); color: var(--text); width: 32px; height: 32px; border-radius: 50%; font-size: 16px; }
  .notes { background: color-mix(in srgb, var(--warn) 12%, transparent); border-radius: 10px; padding: 10px; font-size: 13px; margin-top: 8px; }
  .period { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .period select { background: var(--bg); font-size: 14px; padding: 8px; }
  .toast { background: #2b323d; }
  .rep td { padding: 6px 3px; }
  .rep td:first-child { width: 46%; }
  .rep tr.g td { font-weight: 700; border-top: 2px solid var(--line); }
  .rep tr.h td { font-size: 12px; color: var(--hint); text-transform: uppercase; letter-spacing: .03em; border-top: 0; padding-top: 14px; }
  .rep tr.sub td:first-child { padding-left: 12px; }
  .over { color: var(--bad); } .under { color: var(--ok); }
  .dv { font-size: 11px; font-weight: 500; margin-top: 2px; }
  .rep td { word-break: normal; }
  .rep { font-size: 12px; }
  .rep td.n { font-size: 11.5px; padding-left: 2px; padding-right: 2px; }
  .rep .dv { font-size: 10px; }
  .rep td:first-child { width: auto; }
  .kv { display: flex; justify-content: space-between; padding: 6px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .kv:first-child { border-top: 0; }
  .alert { display: flex; justify-content: space-between; gap: 8px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .alert:first-child { border-top: 0; }
  .kv b, .alert b { white-space: nowrap; }
  .hero .kv { border-color: color-mix(in srgb, var(--accent-text) 25%, transparent); }
</style>
</head>
<body>
<main id="app"><div class="center"><div class="spin"></div>Загрузка…</div></main>
<nav id="nav" hidden>
  <button data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 13h6V4H4zM14 20h6v-9h-6zM14 4v4h6V4zM4 20h6v-3H4z"/></svg>Сводка</button>
  <button data-tab="docs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/></svg>Документы</button>
  <button data-tab="buy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 4h2l2.4 11h11.2L21 7H6.2"/><circle cx="9" cy="19.5" r="1.5"/><circle cx="18" cy="19.5" r="1.5"/></svg>Закупка</button>
  <button data-tab="reports" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Отчёты</button>
</nav>
<script>
// ====== Вставьте сюда адрес веб-приложения Google Apps Script (заканчивается на /exec) ======
const API_URL = 'https://script.google.com/macros/s/AKfycbw6juK8GHilzHdv2zN4VE6syBlK4Ad8gndfmeKLixjNZKyNXYgBErm-WC1HYq_ELZE4kQ/exec';
// ==========================================================================================

const tg = window.Telegram && window.Telegram.WebApp;
const $app = document.getElementById('app');
const $nav = document.getElementById('nav');
let ME = null, TAB = 'home', DOCFILTER = 'На проверке', MONTH = monthNow(), PENDING_FILES = [], CUR = null;
let CLIENT = new URLSearchParams(location.search).get('client') || localStorage.getItem('client') || '';

const STATUS_CLASS = { 'На проверке': 'b-wait', 'Утверждён': 'b-ok', 'Отклонён': 'b-no', 'Ошибка распознавания': 'b-err' };
const MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];

function monthNow() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function money(n) { const v = Math.round((Number(n) || 0) * 100) / 100; const [i, f] = Math.abs(v).toFixed(2).split('.'); return (v < 0 ? '-' : '') + i.replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + (f === '00' ? '' : ',' + f) + ' ₸'; }
function badge(s) { return `<span class="badge ${STATUS_CLASS[s] || 'b-wait'}">${esc(s)}</span>`; }
function checkClass(c) { return /^Сумма сходится/.test(c || '') && !/не найдены/.test(c || '') ? 'check-ok' : 'check-bad'; }
function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 3500); }
function haptic(type) { try { tg.HapticFeedback.notificationOccurred(type); } catch (e) {} }
function loading(text) { $app.innerHTML = `<div class="center"><div class="spin"></div>${esc(text || 'Загрузка…')}</div>`; }

async function api(action, data) {
  const res = await fetch(API_URL, {
    method: 'POST',
    body: JSON.stringify(Object.assign({ action, initData: tg ? tg.initData : '', client: CLIENT }, data || {})),
  });
  const j = await res.json();
  if (j.error === 'no_access') { showNoAccess(j); throw new Error('no_access'); }
  if (j.error) throw new Error(j.error);
  return j;
}

function showNoAccess(j) {
  $nav.hidden = true;
  $app.innerHTML = `<div class="card center"><h1>Нет доступа</h1><p>Передайте этот номер бухгалтеру, вас добавят в список сотрудников.</p><p class="big">${esc(j.telegramId)}</p></div>`;
}

// ====== Навигация ======
$nav.addEventListener('click', e => { const b = e.target.closest('button'); if (b) go(b.dataset.tab); });
function go(tab) {
  TAB = tab; CUR = null;
  [...$nav.children].forEach(b => b.classList.toggle('on', b.dataset.tab === (tab === 'upload' || tab === 'manual' ? 'docs' : tab)));
  if (tg) tg.BackButton.hide();
  if (tab === 'home') renderHome();
  if (tab === 'upload') { renderUpload(); if (tg) tg.BackButton.show(); }
  if (tab === 'manual') { renderManual(); if (tg) tg.BackButton.show(); }
  if (tab === 'docs') renderDocs();
  if (tab === 'reports') renderReports();
  if (tab === 'buy') renderBuy();
  window.scrollTo(0, 0);
}

// ====== Отчёты: ОПиУ, план-факт, ЗП собственницы, ДДС, рассрочки ======
let REP = null, PFROM = '', PTO = '';
const MSHORT = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
function mLabel(k) { const [y, m] = k.split('-'); return MSHORT[Number(m) - 1] + ' ' + y; }
function mDiff(a, b) { const [ay, am] = a.split('-').map(Number), [by, bm] = b.split('-').map(Number); return (by - ay) * 12 + (bm - am); }
function tg0(n) { return money(Math.round(n || 0)); }
function nb(n) { return money(Math.round(n || 0)).replace(' ₸', ''); }
function pct(a, b) { return b ? Math.round((a - b) / Math.abs(b) * 100) : null; }

async function renderReports() {
  if (!REP) {
    loading('Загружаю отчёты…');
    try { REP = await api('reports'); } catch (e) { if (e.message !== 'no_access') $app.innerHTML = `<div class="card">${esc(e.message)}</div>`; return; }
    if (TAB !== 'reports') return;
    if (!REP.months.length) { $app.innerHTML = '<div class="card muted">Отчётов пока нет. Их добавляет бухгалтер после обновления модели.</div>'; return; }
    PFROM = PTO = REP.factTo || REP.months[REP.months.length - 1];
  }
  if (REPVIEW === 'staff') drawStaff();
  else if (REPVIEW === 'days') renderDays();
  else if (REPVIEW === 'years') drawYears();
  else drawReports();
}

function sumRange(arr, idx) { let s = 0, any = false; idx.forEach(i => { if (arr[i] !== null && arr[i] !== undefined) { s += arr[i]; any = true; } }); return any ? s : null; }

function drawReports() {
  const R = REP, ms = R.months;
  const idx = ms.map((m, i) => i).filter(i => ms[i] >= PFROM && ms[i] <= PTO);
  const pl = R.lines.filter(l => l.sec === 'ОПиУ');
  const factIdx = idx.filter(i => pl.some(l => l.fact[i] !== null));
  const hasFact = factIdx.length > 0;
  const cmpIdx = hasFact ? factIdx : idx;
  const val = (l, kind) => sumRange(kind === 'f' ? l.fact : l.plan, kind === 'f' ? factIdx : cmpIdx) || 0;
  const tot = (kind, grp) => pl.filter(l => l.grp === grp).reduce((s, l) => s + val(l, kind), 0);
  const calc = kind => {
    const rev = tot(kind, 'Выручка'), vr = tot(kind, 'Переменные'), fx = tot(kind, 'Постоянные'), bt = tot(kind, 'Амортизация и налог');
    const own = R.lines.filter(l => l.sec === 'Собственница');
    const get = g => own.filter(l => l.grp === g).reduce((s, l) => s + val(l, kind), 0);
    const net = rev - vr - fx - bt, zp = get('ЗП'), adj = get('Поправки');
    return { rev, vr, fx, bt, ebitda: rev - vr - fx, net, zp, adj, norm: net - zp - adj, ownServ: get('Услуги') };
  };
  const F = calc('f'), P = calc('p');
  const opts = ms.map(m => `<option value="${m}">${mLabel(m)}${m > (R.factTo || '') ? ' (план)' : ''}</option>`).join('');
  const lastQ = ms.filter(m => m <= R.factTo).slice(-3);
  const yearOf = m => m.slice(0, 4);
  const dev = (f, p, isRev) => {
    if (!hasFact || !p) return '';
    const d = f - p, k = pct(f, p);
    const bad = isRev ? d < 0 : d > 0;
    if (Math.abs(d) < 1) return '<span class="muted">0</span>';
    return `<span class="${bad ? 'over' : 'under'}">${d > 0 ? '+' : ''}${tg0(d)}${k !== null ? ' (' + (k > 0 ? '+' : '') + k + '%)' : ''}</span>`;
  };
  // перерасходы
  const alerts = [];
  if (hasFact) pl.forEach(l => {
    const f = val(l, 'f'), p = val(l, 'p'), d = f - p;
    if (l.grp === 'Выручка') { if (p > 0 && d < -Math.max(20000, p * 0.05)) alerts.push({ t: l.name + ': ниже плана', d }); }
    else if (l.grp !== 'Амортизация и налог' && d > Math.max(10000, p * 0.1)) alerts.push({ t: l.name, d });
  });
  // Меруерт сделала меньше услуг, чем по плану (её клиентов взяли наёмные или клиентов меньше)
  const ownL = R.lines.find(l => l.sec === 'Собственница' && l.grp === 'Услуги');
  if (hasFact && ownL) {
    const f = sumRange(ownL.fact, factIdx) || 0, p = sumRange(ownL.plan, factIdx) || 0;
    if (p && f < p - Math.max(50000, p * 0.05)) alerts.push({ t: 'Услуги Меруерт: ниже плана', d: f - p });
  }
  alerts.sort((a, b) => Math.abs(b.d) - Math.abs(a.d));
  const devS = (f, p, isRev) => {
    if (!hasFact || !p) return '';
    const d = f - p, k = pct(f, p);
    if (Math.abs(d) < 1) return '';
    const bad = isRev ? d < 0 : d > 0;
    return `<span class="${bad ? 'over' : 'under'}">${d > 0 ? '+' : ''}${nb(d)}${k !== null ? `<div class="dv">${k > 0 ? '+' : ''}${k}%</div>` : ''}</span>`;
  };
  const row = (name, f, p, cls, isRev) => `<tr class="${cls || ''}"><td>${esc(name)}</td><td class="n">${hasFact ? nb(f) : ''}</td><td class="n muted">${nb(p)}</td><td class="n">${devS(f, p, isRev)}</td></tr>`;
  const grpRows = (grp, isRev) => pl.filter(l => l.grp === grp).sort((a, b) => a.order - b.order)
    .filter(l => Math.abs(val(l, 'f')) + Math.abs(val(l, 'p')) > 0)
    .map(l => row(l.name, val(l, 'f'), val(l, 'p'), 'sub', isRev)).join('');
  // ДДС
  const dl = R.lines.filter(l => l.sec === 'ДДС');
  const dIdx = idx.filter(i => dl.some(l => l.fact[i] !== null && l.grp !== 'Остаток на начало' && l.grp !== 'Остаток на конец'));
  const dv = l => sumRange(l.fact, dIdx) || 0;
  const dGrp = g => dl.filter(l => l.grp === g && Math.abs(dv(l)) > 0).sort((a, b) => a.order - b.order);
  const dSum = g => dGrp(g).reduce((s, l) => s + dv(l), 0);
  const startL = dl.find(l => l.grp === 'Остаток на начало'), endL = dl.find(l => l.grp === 'Остаток на конец');
  const ddsHtml = dIdx.length ? `
    <table class="rep"><tbody>
      <tr class="g"><td>Остаток на начало</td><td class="n">${tg0(startL ? startL.fact[dIdx[0]] : 0)}</td></tr>
      <tr class="h"><td colspan="2">Поступления</td></tr>
      ${dGrp('Поступления').map(l => `<tr class="sub"><td>${esc(l.name)}</td><td class="n">${tg0(dv(l))}</td></tr>`).join('')}
      <tr class="g"><td>Поступления итого</td><td class="n">${tg0(dSum('Поступления'))}</td></tr>
      <tr class="h"><td colspan="2">Выплаты</td></tr>
      ${dGrp('Выплаты').map(l => `<tr class="sub"><td>${esc(l.name)}</td><td class="n">${tg0(dv(l))}</td></tr>`).join('')}
      <tr class="g"><td>Выплаты итого</td><td class="n">${tg0(dSum('Выплаты'))}</td></tr>
      ${dGrp('Инвестиции').length ? `<tr class="h"><td colspan="2">Оборудование</td></tr>${dGrp('Инвестиции').map(l => `<tr class="sub"><td>${esc(l.name)}</td><td class="n">${tg0(dv(l))}</td></tr>`).join('')}` : ''}
      <tr class="h"><td colspan="2">Кредиты и собственница</td></tr>
      ${dGrp('Финансы').map(l => `<tr class="sub"><td>${esc(l.name)}</td><td class="n">${tg0(dv(l))}</td></tr>`).join('')}
      <tr class="g"><td>Остаток на конец</td><td class="n">${tg0(endL ? endL.fact[dIdx[dIdx.length - 1]] : 0)}</td></tr>
    </tbody></table>
    <div class="muted" style="margin-top:6px">Остаток это счёт Kaspi Pay: выручка с него каждый день уходит на карту Меруерт.</div>` : '<div class="muted">За этот период движения денег нет (будет после внесения журнала).</div>';
  // рассрочки
  const now = R.today || monthNow();
  const loans = R.loans.map(x => {

// ---------- Условия оплаты ----------
const WD = { 'вс': 0, 'пн': 1, 'вт': 2, 'ср': 3, 'чт': 4, 'пт': 5, 'сб': 6 };
function offDays(s) { return String(s || '').toLowerCase().split(/[,\s]+/).map(x => WD[x.slice(0, 2)]).filter(x => x !== undefined); }
function ruleFor(rules, name, month) {
  return rules.filter(r => r.name === name && r.from <= month).sort((a, b) => a.from < b.from ? 1 : -1)[0] || null;
}
function workdays(month, off) {
  const [y, m] = month.split('-').map(Number), n = new Date(y, m, 0).getDate(), o = offDays(off);
  let c = 0; for (let d = 1; d <= n; d++) if (!o.includes(new Date(y, m - 1, d).getDay())) c++;
  return c;
}
function tabelShare(tabel, name, month, off) {
  const t = (tabel || []).find(x => x.name === name && x.month === month);
  if (!t) return 1;
  const w = workdays(month, off);
  return w ? Math.min(1, t.days / w) : 1;
}

// ---------- Сотрудники: положено и выплачено по месяцам ----------
function drawStaff() {
  const R = REP, ms = R.months, rules = R.staff || [];
  const idx = ms.map((m, i) => i).filter(i => ms[i] >= PFROM && ms[i] <= PTO && ms[i] <= R.factTo);
  const opts = ms.filter(m => m <= R.factTo).map(m => `<option value="${m}">${mLabel(m)}</option>`).join('');
  const center = R.lines.find(l => l.sec === 'ОПиУ' && l.name === 'Услуги');
  const sl = R.lines.filter(l => l.sec === 'Сотрудники');
  const people = [...new Set(sl.map(l => l.grp))];
  const cards = people.map(name => {
    const serv = sl.find(l => l.grp === name && l.name === 'Услуги'), paid = sl.find(l => l.grp === name && l.name === 'Выплачено');
    let s = 0, acc = 0, sal = 0, tgt = 0, bon = 0, pd = 0, anyPaid = false, role = '', pct = 0, cpct = 0;
    idx.forEach(i => {
      const m = ms[i], r = ruleFor(rules, name, m);
      if (!r) return;
      role = r.role; pct = r.pct; cpct = r.centerPct;
      const sv = serv ? (serv.fact[i] || 0) : 0, share = tabelShare(R.tabel, name, m, r.off);
      s += sv;
      const own = sv * r.pct / 100, a = r.salary * share, b = r.target * share, c = (center && center.fact[i] || 0) * r.centerPct / 100 * share;
      acc += own + a + b + c; sal += a; tgt += b; bon += c;
      if (paid && paid.fact[i] !== null) { pd += paid.fact[i]; anyPaid = true; }
    });
    if (!role) return '';
    const last = rules.filter(x => x.name === name).slice(-1)[0];
    const diff = acc - pd;
    return `<div class="card">
      <div class="row"><b>${esc(name)}</b><span class="muted">${esc(role)}${last && last.off ? ' · выходные ' + esc(last.off) : ''}</span></div>
      <div style="margin-top:6px">
        ${s ? `<div class="kv"><span>Услуги (Altegio)</span><b>${tg0(s)}</b></div>` : ''}
        ${s && pct ? `<div class="kv"><span>${pct}% от своих услуг</span><b>${tg0(s * pct / 100)}</b></div>` : ''}
        ${sal ? `<div class="kv"><span>Оклад</span><b>${tg0(sal)}</b></div>` : ''}
        ${tgt ? `<div class="kv"><span>Таргет</span><b>${tg0(tgt)}</b></div>` : ''}
        ${bon ? `<div class="kv"><span>Бонус ${cpct}% от услуг центра</span><b>${tg0(bon)}</b></div>` : ''}
        <div class="kv"><span><b>Положено</b></span><b class="gold">${tg0(acc)}</b></div>
        ${anyPaid ? `<div class="kv"><span>Выплачено (журнал)</span><b>${tg0(pd)}</b></div>
        <div class="kv"><span>${diff >= 0 ? 'Не доплачено' : 'Переплачено'}</span><b class="${Math.abs(diff) > 1000 ? 'over' : 'under'}">${tg0(Math.abs(diff))}</b></div>`
        : `<div class="muted" style="margin-top:4px">${/собствен/i.test(role) ? 'Выплат в журнале нет: собственница берёт из прибыли.' : 'Выплат за период в журнале нет.'}</div>`}
      </div></div>`;
  }).join('');
  $app.innerHTML = `
    <h1>Отчёты · ${esc(ME.client.name)}</h1>
    ${viewChips()}
    <div class="period">
      <label class="f" style="margin:0"><span>С месяца</span><select id="pf">${opts}</select></label>
      <label class="f" style="margin:0"><span>По месяц</span><select id="pt">${opts}</select></label>
    </div>
    ${idx.length ? cards : '<div class="card muted">За этот период данных нет. Факт есть по ' + esc(mLabel(R.factTo)) + '.</div>'}
    <div class="muted" style="padding:0 6px">Условия и выходные на листе «Сотрудники», отпуска на листе «Табель» в таблице клиента. Выплаты из журнала Дианы. Мастерам процент от услуг без предоплат.</div>`;
  bindViews();
  const pf = document.getElementById('pf'), pt = document.getElementById('pt');
  if (PFROM > R.factTo) PFROM = R.factTo;
  if (PTO > R.factTo) PTO = R.factTo;
  pf.value = PFROM; pt.value = PTO;
  pf.onchange = () => { PFROM = pf.value; if (PTO < PFROM) PTO = PFROM; drawStaff(); };
  pt.onchange = () => { PTO = pt.value; if (PFROM > PTO) PFROM = PTO; drawStaff(); };
}

// ---------- По дням: записи Altegio ----------
let DAYPER = 'week0', DAYDATA = null, DAYOPEN = '';
const WDS = ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];
function dayRange(k) {
  const now = new Date(), d0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  if (k === 'today') return [d0, d0];
  if (k === 'yest') { const y = new Date(d0); y.setDate(y.getDate() - 1); return [y, y]; }
  if (k === 'week0' || k === 'week1') {
    const mon = new Date(d0); mon.setDate(d0.getDate() - ((d0.getDay() + 6) % 7) - (k === 'week1' ? 7 : 0));
    const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
    return [mon, sun];
  }
  const a = new Date(d0.getFullYear(), d0.getMonth() - (k === 'month1' ? 1 : 0), 1);
  return [a, new Date(a.getFullYear(), a.getMonth() + 1, 0)];
}
async function renderDays() {
  const [a, b] = dayRange(DAYPER), from = ymd(a), to = ymd(b);
  const head = `<h1>Отчёты · ${esc(ME.client.name)}</h1>${viewChips()}
    <div class="chips">${[['today', 'Сегодня'], ['yest', 'Вчера'], ['week0', 'Эта неделя'], ['week1', 'Прошлая неделя'], ['month0', 'Этот месяц'], ['month1', 'Прошлый месяц']]
      .map(([k, t]) => `<button class="chip ${k === DAYPER ? 'on' : ''}" data-dp="${k}">${t}</button>`).join('')}</div>`;
  const bindHead = () => { bindViews(); $app.querySelectorAll('[data-dp]').forEach(x => x.onclick = () => { DAYPER = x.dataset.dp; DAYDATA = null; renderDays(); }); };
  if (!DAYDATA || DAYDATA.from !== from || DAYDATA.to !== to) {
    $app.innerHTML = head + '<div class="center"><div class="spin"></div>Загружаю записи из Altegio…</div>';
    bindHead();
    try { DAYDATA = await api('daily', { from, to }); }
    catch (e) { if (e.message !== 'no_access') { $app.innerHTML = head + `<div class="card">${esc(e.message)}</div>`; bindHead(); } return; }
    if (TAB !== 'reports' || REPVIEW !== 'days') return;
  }
  const D = DAYDATA, rules = D.staff || [], today = ymd(new Date());
  const tot = D.days.reduce((s, d) => ({ sum: s.sum + d.sum, visits: s.visits + d.visits, noshow: s.noshow + d.noshow, planned: s.planned + d.planned }), { sum: 0, visits: 0, noshow: 0, planned: 0 });
  const by = {};
  D.days.forEach(d => Object.keys(d.staff).forEach(n => { const x = by[n] || (by[n] = { sum: 0, visits: 0 }); x.sum += d.staff[n].sum; x.visits += d.staff[n].visits; }));
  const month = from.slice(0, 7);
  const rows = Object.keys(by).sort((x, y) => by[y].sum - by[x].sum).map(n => {
    const r = ruleFor(rules, n, month);
    return `<tr><td>${esc(n)}<div class="muted">${by[n].visits} визитов</div></td><td class="n">${tg0(by[n].sum)}</td><td class="n gold">${r && r.pct ? tg0(by[n].sum * r.pct / 100) : ''}</td></tr>`;
  }).join('');
  // администратор: оклад и таргет по её рабочим дням + % от услуг центра за эти дни
  const admins = [...new Set(rules.filter(r => r.salary || r.target || r.centerPct).map(r => r.name))].map(n => {
    let acc = 0, days = 0;
    for (let d = new Date(a); d <= b && ymd(d) <= today; d.setDate(d.getDate() + 1)) {
      const m = ymd(d).slice(0, 7), r = ruleFor(rules, n, m);
      if (!r || offDays(r.off).includes(d.getDay())) continue;
      const w = workdays(m, r.off), day = D.days.find(x => x.date === ymd(d));
      acc += (r.salary + r.target) / w + (day ? day.sum : 0) * r.centerPct / 100; days++;
    }
    return days ? `<tr><td>${esc(n)}<div class="muted">${days} ${plural(days, 'рабочий день', 'рабочих дня', 'рабочих дней')}</div></td><td class="n"></td><td class="n gold">${tg0(acc)}</td></tr>` : '';
  }).join('');
  const list = D.days.slice().reverse().map(d => {
    const dt = new Date(d.date + 'T00:00:00'), open = DAYOPEN === d.date;
    return `<div class="card doc" data-day="${d.date}" style="padding:12px">
      <div class="row"><b>${dm(dt)} ${WDS[dt.getDay()]}</b><b>${tg0(d.sum)}</b></div>
      <div class="muted">${d.visits} визитов${d.noshow ? ' · не пришли: ' + d.noshow : ''}${d.planned ? ' · ожидается ' + tg0(d.planned) : ''}</div>
      ${open ? `<div style="margin-top:6px">${Object.keys(d.staff).map(n => `<div class="kv"><span>${esc(n)} · ${d.staff[n].visits}</span><b>${tg0(d.staff[n].sum)}</b></div>`).join('') || '<div class="muted">Пришедших нет</div>'}</div>` : ''}
    </div>`;
  }).join('');
  $app.innerHTML = head + `
    <div class="grid2">
      <div class="card"><div class="muted">Выручка (услуги)</div><div class="big gold" style="font-size:22px">${tg0(tot.sum)}</div><div class="muted">${dm(a)}-${dm(b)}</div></div>
      <div class="card"><div class="muted">Визиты</div><div class="big" style="font-size:22px">${tot.visits}</div><div class="muted">не пришли: ${tot.noshow}${tot.planned ? ' · ожидается ' + tg0(tot.planned) : ''}</div></div>
    </div>
    <h2>Мастера и ЗП за период</h2>
    <div class="card" style="padding:10px"><table class="rep"><tbody>
      <tr class="h"><td></td><td class="n">Услуги</td><td class="n">Положено</td></tr>
      ${rows || '<tr><td class="muted" colspan="3">Записей нет</td></tr>'}${admins}
    </tbody></table></div>
    <h2>По дням</h2>
    <div class="dlist">${list || '<div class="card muted">Записей нет</div>'}</div>
    <div class="muted" style="padding:6px">Из записей Altegio: только пришедшие клиенты, без продажи товаров. Оклад и таргет администратора делятся на её рабочие дни месяца (по выходным на листе «Сотрудники»).</div>`;
  bindHead();
  $app.querySelectorAll('[data-day]').forEach(c => c.onclick = () => { DAYOPEN = DAYOPEN === c.dataset.day ? '' : c.dataset.day; renderDays(); });
}

// ---------- По годам ----------
let YKIND = 'revenue';

  const data = Y[YKIND], years = Object.keys(data).sort(), last = years[years.length - 1], prev = years[years.length - 2];
  const fmt = v => v === null || v === undefined ? '' : (YKIND === 'revenue' ? (v / 1e6).toFixed(2).replace('.', ',') : String(v));
  const g = (x, y) => (x !== null && x !== undefined && y) ? Math.round((x - y) / y * 100) : null;
  const filled = data[last].map((v, i) => v !== null ? i : -1).filter(i => i >= 0);

  const rows = MSHORT.map((m, i) => {

  }).join('');

    <div class="card" style="padding:10px"><table class="rep"><tbody>
      <tr class="h"><td>${YKIND === 'revenue' ? 'млн ₸' : 'визитов'}</td>${years.map(y => `<td class="n">${y}</td>`).join('')}<td class="n">${last} к ${prev}</td></tr>
      ${rows}
      <tr class="g"><td>${MSHORT[filled[0]]}-${MSHORT[filled[filled.length - 1]]}</td>${years.map(y => `<td class="n">${fmt(ytd(y))}</td>`).join('')}<td class="n ${kt < 0 ? 'over' : 'under'}">${kt === null ? '' : (kt > 0 ? '+' : '') + kt + '%'}</td></tr>
    </tbody></table></div>
    <div class="muted" style="padding:0 6px">По записям Altegio (услуги и товары). Altegio ведётся с марта 2024 г. Итог сравнивает одинаковые месяцы.</div>`;
  bindViews();
  $app.querySelectorAll('[data-yk]').forEach(x => x.onclick = () => { YKIND = x.dataset.yk; drawYears(); });
}

let BUYF = 'need';
async function renderBuy() {
  loading('Загружаю товары…');
  let r;
  try { r = await api('goods'); } catch (e) { if (e.message !== 'no_access') $app.innerHTML = `<div class="card">${esc(e.message)}</div>`; return; }
  if (TAB !== 'buy') return;
  const g = r.goods || [];
  const grp = x => x.stock === null ? 'none' : x.stock < 0 ? 'neg' : x.stock === 0 ? 'zero' : (x.min > 0 && x.stock <= x.min) ? 'low' : 'ok';

function renderUpload() {
  $app.innerHTML = `
    <h1>Новый документ</h1>

      <div class="btns"><button class="btn" id="send" disabled>Отправить на распознавание</button></div>
    </div>
    <div class="muted" style="padding:0 6px">Фото должно быть ровным и чётким, документ целиком в кадре. Распознавание занимает до минуты. Одностраничный чек можно просто отправить фото в чат бота.</div>`;
  PENDING_FILES = [];
  document.getElementById('file').onchange = async e => {
    for (const f of e.target.files) {
      if (PENDING_FILES.length >= 6) { toast('Не больше 6 страниц'); break; }
      try { PENDING_FILES.push(await prepareFile(f)); } catch (err) { toast(err.message); }
    }
    e.target.value = '';
    drawThumbs();
  };
  document.getElementById('send').onclick = sendUpload;
}
function drawThumbs() {
  const t = document.getElementById('thumbs');
  t.innerHTML = PENDING_FILES.map((f, i) => f.mime === 'application/pdf'
    ? `<div class="pdf" data-i="${i}">PDF ✕</div>`
    : `<img src="data:${f.mime};base64,${f.data}" data-i="${i}" alt="">`).join('');
  t.querySelectorAll('[data-i]').forEach(el => el.onclick = () => { PENDING_FILES.splice(Number(el.dataset.i), 1); drawThumbs(); });
  document.getElementById('send').disabled = PENDING_FILES.length === 0;
}
function prepareFile(file) {
  return new Promise((resolve, reject) => {
    if (file.type === 'application/pdf') {
      if (file.size > 8 * 1024 * 1024) return reject(new Error('PDF больше 8 МБ'));
      const r = new FileReader();
      r.onload = () => resolve({ mime: 'application/pdf', data: String(r.result).split(',')[1] });
      r.onerror = () => reject(new Error('Не удалось прочитать файл'));
      return r.readAsDataURL(file);
    }
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 2000, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve({ mime: 'image/jpeg', data: c.toDataURL('image/jpeg', 0.85).split(',')[1] });
    };
    img.onerror = () => reject(new Error('Это не фото'));
    img.src = url;
  });
}
async function sendUpload() {
  const pay = document.getElementById('pay').value, comment = document.getElementById('comment').value;
  const files = PENDING_FILES.slice();
  loading('Распознаю документ… обычно 20-60 секунд');
  try {
    const doc = await api('upload', { files, payment: pay, comment });
    haptic(doc.status === 'Ошибка распознавания' ? 'error' : 'success');
    PENDING_FILES = [];
    openDoc(doc.id);
  } catch (e) {
    if (e.message === 'no_access') return;
    haptic('error'); toast(e.message); renderUpload(); PENDING_FILES = files; drawThumbs();
  }
}

// ====== Список ======
let DPER = 'all', DOFF = 0;   // период списка: неделя, месяц или всё; DOFF = сдвиг назад
function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function dm(d) { return String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0'); }
function docPeriod() {
  const now = new Date();
  if (DPER === 'week') {
    const mon = new Date(now.getFullYear(), now.getMonth(), now.getDate() - ((now.getDay() + 6) % 7) + DOFF * 7);
    const sun = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + 6);
    return { from: ymd(mon), to: ymd(sun), label: dm(mon) + '-' + dm(sun) };
  }
  if (DPER === 'month') {
    const a = new Date(now.getFullYear(), now.getMonth() + DOFF, 1), b = new Date(a.getFullYear(), a.getMonth() + 1, 0);
    return { from: ymd(a), to: ymd(b), label: MONTHS[a.getMonth()] + ' ' + a.getFullYear() };
  }
  return { from: '', to: '', label: 'за всё время' };
}

      </div>
      <label class="f"><span>Статья</span><select name="category" ${ro}>${catOpts(d.category)}</select></label>
      <label class="f"><span>Комментарий</span><textarea name="comment" ${ro}>${esc(d.comment)}</textarea></label>
    </div>
    <h2>Строки документа · ${money(d.linesSum)}</h2>
    <div class="card"><table><tbody>${d.lines.map(l => `
      <tr><td>${esc(l.name)}<div class="alt ${l.goodId ? 'yes' : 'no'}">${l.goodId ? 'Altegio: ' + esc(l.goodTitle) : 'нет в Altegio'}</div>
        ${d.canEdit ? `<select data-line="${l.no - 1}" style="margin-top:4px;padding:6px;font-size:13px">${catOpts(l.category)}</select>` : `<div class="muted">${esc(l.category)}</div>`}</td>
      <td class="n">${esc(l.qty)} ${esc(unitRu(l.unit))}<div class="muted">× ${money(l.price)}</div></td>
      <td class="n"><b>${money(l.sum)}</b></td></tr>`).join('') || '<tr><td class="muted">Строк нет</td></tr>'}</tbody></table></div>
    ${d.altegio ? `<div class="card"><b>Altegio:</b> ${esc(d.altegio)}</div>` : ''}
    <div class="btns">
      ${d.canEdit ? '<button class="btn sec" id="save">Сохранить изменения</button>' : ''}
      ${d.canApprove ? '<input id="reason" placeholder="Причина, если отклоняете"><div class="btns two" style="margin:0"><button class="btn ok" id="approve">Утвердить</button><button class="btn bad" id="reject">Отклонить</button></div>' : ''}
      ${d.canEdit && d.status !== 'Утверждён' && d.kind !== 'Без документа' ? '<button class="btn sec" id="retry">Распознать заново</button>' : ''}
      ${ME.user.approver && d.status === 'Утверждён' && !d.altegioId ? '<button class="btn" id="toAltegio">Отправить в Altegio</button>' : ''}
    </div>`;
  const form = () => {
    const f = {};
    document.querySelectorAll('#form [name]').forEach(el => f[el.name] = el.value.trim());
    return f;
  };
  const lines = () => d.lines.map((l, i) => {
    const sel = document.querySelector(`[data-line="${i}"]`);
    return { name: l.name, qty: l.qty, unit: l.unit, price: l.price, sum: l.sum, category: sel ? sel.value : l.category, goodId: l.goodId };
  });
  const act = async (btn, fn, okText) => {
    const b = document.getElementById(btn); if (!b) return;
    b.onclick = async () => {
      b.disabled = true;
      try { const r = await fn(); haptic('success'); toast(okText + (r && r.altegioResult ? ' · Altegio: ' + r.altegioResult : '')); openDoc(d.id); }
      catch (e) { haptic('error'); toast(e.message); b.disabled = false; if (!document.body.contains(b)) openDoc(d.id); }
    };
  };
  act('save', () => api('update', { id: d.id, fields: form(), lines: d.canEdit ? lines() : undefined }), 'Сохранено');
  act('approve', async () => { if (d.canEdit) await api('update', { id: d.id, fields: form(), lines: lines() }); return api('approve', { id: d.id }); }, 'Утверждено');
  act('reject', () => {
    const reason = document.getElementById('reason').value.trim();
    if (!reason) throw new Error('Напишите причину отклонения');
    return api('reject', { id: d.id, reason });
  }, 'Отклонено');
  act('retry', () => { loading('Распознаю заново…'); return api('retry', { id: d.id }); }, 'Распознано заново');
  act('toAltegio', async () => { const r = await api('sendAltegio', { id: d.id }); return { altegioResult: r.result }; }, 'Отправлено');
}

// ====== Клиент ======
async function loadMe() {
  ME = await api('me');
  CLIENT = ME.client.code;
  localStorage.setItem('client', CLIENT);
  document.title = ME.client.name;
  REP = null;
  $nav.querySelector('[data-tab="reports"]').hidden = !ME.user.approver;
}
async function switchClient(code) {
  CLIENT = code;
  loading();
  try { await loadMe(); go('home'); } catch (e) { if (e.message !== 'no_access') toast(e.message); }
}

// ====== Запуск ======
async function start() {
  if (tg) {
    tg.ready(); tg.expand();
    tg.BackButton.onClick(() => go(TAB === 'upload' || TAB === 'manual' ? 'docs' : TAB));
    try { tg.setHeaderColor('#0f1216'); tg.setBackgroundColor('#0f1216'); } catch (e) {}
    try { if (tg.setBottomBarColor) tg.setBottomBarColor('#1a1e25'); } catch (e) {}
    // На телефоне: на весь экран, как в видео (Telegram 8.0 и новее). Свайп вниз не закрывает приложение.
    const mobile = ['ios', 'android', 'android_x'].includes(tg.platform);
    try { if (mobile && tg.isVersionAtLeast && tg.isVersionAtLeast('8.0') && tg.requestFullscreen) tg.requestFullscreen(); } catch (e) {}
    try { if (tg.isVersionAtLeast && tg.isVersionAtLeast('7.7') && tg.disableVerticalSwipes) tg.disableVerticalSwipes(); } catch (e) {}
  }
  if (!tg || !tg.initData) {
    $app.innerHTML = '<div class="card center"><h1>Финансы с Арайлым</h1><p>Откройте приложение через бота в Telegram.</p></div>';
    return;
  }
  try {
    await loadMe();
    $nav.hidden = false;
    const docParam = new URLSearchParams(location.search).get('doc');
    go('home');
    if (docParam) openDoc(docParam);
  } catch (e) {
    if (e.message !== 'no_access') $app.innerHTML = `<div class="card">Не удалось подключиться: ${esc(e.message)}</div>`;
  }
}
start();
</script>
