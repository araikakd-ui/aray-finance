  .docrow { display: flex; gap: 10px; align-items: center; }

  .doc .row > * { min-width: 0; overflow-wrap: anywhere; }
  html, body { overflow-x: hidden; }
  .dlist > * + * { margin-top: 8px; }
  h1 { font-size: 20px; margin: 4px 4px 12px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--hint); margin: 18px 6px 8px; font-weight: 600; }
  .card { background: var(--bg); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .muted { color: var(--hint); font-size: 13px; }
  .big { font-size: 28px; font-weight: 700; letter-spacing: -.01em; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .hero { background: linear-gradient(135deg, #2fd1b2 0%, #17a58b 100%); color: var(--accent-text); }
  .hero .muted { color: color-mix(in srgb, var(--accent-text) 80%, transparent); }

  .badge { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .b-wait { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
  .b-ok { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
  .b-no, .b-err { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }
  .check-ok { color: var(--ok); } .check-bad { color: var(--bad); }

  .chip.on { background: var(--accent); color: var(--accent-text); }
  button.btn { border: 0; width: 100%; padding: 13px; border-radius: 12px; font: inherit; font-weight: 600; background: var(--accent); color: var(--accent-text); }
  button.btn.sec { background: var(--field); color: var(--text); }
  button.btn.ok { background: var(--ok); } button.btn.bad { background: var(--bad); }
  button.btn:disabled { opacity: .5; }
  .btns { display: grid; gap: 8px; margin-top: 10px; }
  .btns.two { grid-template-columns: 1fr 1fr; }
  label.f { display: block; margin-bottom: 10px; }
  label.f span { display: block; font-size: 12px; color: var(--hint); margin: 0 0 4px 2px; }
  input, select, textarea { width: 100%; font: inherit; color: var(--text); background: var(--field); border: 1px solid transparent; border-radius: 10px; padding: 10px; color-scheme: dark; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
  textarea { min-height: 60px; resize: vertical; }
  .thumbs { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
  .thumbs img, .thumbs .pdf { width: 76px; height: 96px; object-fit: cover; border-radius: 10px; background: var(--bg2); display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--hint); }
  main > .btns .btn.sec, main > .btns input { background: var(--bg); }
  .row h1 { font-size: 18px; white-space: nowrap; }
  .monthsw b { white-space: nowrap; font-size: 14px; }

  .photos { display: flex; gap: 8px; overflow-x: auto; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }

function cget(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
function cput(k, v) {
  const s = JSON.stringify(v);
  for (let t = 0; t < 2; t++) {
    try {
      localStorage.setItem(k, s);
      const idx = (cget(CK + 'idx') || []).filter(x => x !== k); idx.push(k);
      while (idx.length > 40) localStorage.removeItem(idx.shift());   // храним не больше 40 страниц

async function load(action, data, o) {

  else if (o.wait) o.wait();

  } catch (e) {
    if (e.message === 'no_access' || !o.alive()) return;
    if (old) toast('Не удалось обновить: ' + e.message); else o.fail(e);
  } finally { if (old) refreshing(false); }
}

function sumRange(arr, idx) { let s = 0, any = false; idx.forEach(i => { if (arr[i] !== null && arr[i] !== undefined) { s += arr[i]; any = true; } }); return any ? s : null; }

// ---------- Расчёт ОПиУ за выбранные месяцы ----------
function plCalc(R, idx) {
  const pl = R.lines.filter(l => l.sec === 'ОПиУ');
  const factIdx = idx.filter(i => pl.some(l => l.fact[i] !== null));
  const hasFact = factIdx.length > 0, cmpIdx = hasFact ? factIdx : idx;
  const val = (l, kind) => sumRange(kind === 'f' ? l.fact : l.plan, kind === 'f' ? factIdx : cmpIdx) || 0;
  const tot = (kind, grp) => pl.filter(l => l.grp === grp).reduce((s, l) => s + val(l, kind), 0);
  const own = R.lines.filter(l => l.sec === 'Собственница');
  const calc = kind => {
    const rev = tot(kind, 'Выручка'), vr = tot(kind, 'Переменные'), fx = tot(kind, 'Постоянные'), bt = tot(kind, 'Амортизация и налог');
    const get = g => own.filter(l => l.grp === g).reduce((s, l) => s + val(l, kind), 0);
    const net = rev - vr - fx - bt, zp = get('ЗП'), adj = get('Поправки');
    return { rev, vr, fx, bt, ebitda: rev - vr - fx, net, zp, adj, norm: net - zp - adj, ownServ: get('Услуги') };
  };
  const F = calc('f'), P = calc('p');
  // что вышло за план
  const alerts = [];
  if (hasFact) pl.forEach(l => {
    const f = val(l, 'f'), p = val(l, 'p'), d = f - p;
    if (l.grp === 'Выручка') { if (p > 0 && d < -Math.max(20000, p * 0.05)) alerts.push({ t: l.name + ': ниже плана', d }); }
    else if (l.name === 'Расходники и материалы') return;   // в ОПиУ по норме от услуг, следим за закупками ниже
    else if (l.grp !== 'Амортизация и налог' && d > Math.max(10000, p * 0.1)) alerts.push({ t: l.name, d });
  });
  // Закупки расходников (ДДС, по оплате) за 3 последних месяца с фактом против нормы в ОПиУ: больше на 20% = закупили впрок или тратят больше нормы
  const lastF = factIdx[factIdx.length - 1];
  if (lastF !== undefined) {
    const k3 = [lastF - 2, lastF - 1, lastF].filter(i => i >= 0 && pl.some(l => l.fact[i] !== null));
    const buy = R.lines.find(l => l.sec === 'ДДС' && l.name === 'Расходники и материалы'), norm = pl.find(l => l.name === 'Расходники и материалы');

      const b = sumRange(buy.fact, k3) || 0, n = sumRange(norm.fact, k3) || 0;
      if (n && b > n * 1.2) alerts.push({ t: 'Закупки расходников за 3 мес. больше нормы', d: b - n });
    }
  }
  // собственник сделала меньше услуг, чем по плану (её клиентов взяли наёмные или клиентов меньше)
  const ownL = own.find(l => l.grp === 'Услуги');
  if (hasFact && ownL) {
    const f = sumRange(ownL.fact, factIdx) || 0, p = sumRange(ownL.plan, factIdx) || 0;
    if (p && f < p - Math.max(50000, p * 0.05)) alerts.push({ t: 'Услуги собственника: ниже плана', d: f - p });
  }
  alerts.sort((a, b) => Math.abs(b.d) - Math.abs(a.d));
  return { pl, factIdx, hasFact, val, F, P, alerts };
}

// ЗП мастеров по именам: выплачено (журнал) и положено (их услуги × ставка). Разница со строкой ОПиУ = «прочее».
function zpPeople(R, line, X) {
  if (!/мастер|мастер/i.test(line.name)) return null;
  const rules = R.staff || [], sl = R.lines.filter(l => l.sec === 'Сотрудники');
  // выплаты по имени: из раздела «Сотрудники», а если его нет, из ДДС («ЗП мастера: Старший мастер»)
  const ddsPaid = {};
  R.lines.filter(l => l.sec === 'ДДС' && /^ЗП (мастера|мастера):/i.test(l.name)).forEach(l => { ddsPaid[l.name.split(':')[1].trim()] = l; });
  const people = [...new Set(sl.map(l => l.grp).concat(Object.keys(ddsPaid)))].filter(n => {
    const r = rules.filter(x => x.name === n).slice(-1)[0];
    return r ? !/собствен|админ/i.test(r.role) : !!ddsPaid[n];
  });
  const rows = people.map(n => {
    const paid = sl.find(l => l.grp === n && l.name === 'Выплачено') || ddsPaid[n], serv = sl.find(l => l.grp === n && l.name === 'Услуги');
    const f = paid ? (sumRange(paid.fact, X.factIdx) || 0) : 0;
    let p = 0;
    X.factIdx.forEach(i => { const r = ruleFor(rules, n, R.months[i]); if (r && serv) p += (serv.fact[i] || 0) * r.pct / 100; });
    return { n, f: Math.round(f), p: Math.round(p) };
  }).filter(x => x.f || x.p).sort((a, b) => b.f - a.f);
  if (!rows.length) return null;
  const hasPlan = rows.some(x => x.p);
  if (!hasPlan) rows.forEach(x => { x.p = null; });   // услуг по именам нет: план по людям не показываем
  const rf = X.val(line, 'f') - rows.reduce((s, x) => s + x.f, 0), rp = hasPlan ? X.val(line, 'p') - rows.reduce((s, x) => s + x.p, 0) : 0;
  if (Math.abs(rf) >= 1 || Math.abs(rp) >= 1) rows.push({ n: 'Прочее (вне журнала, округления)', f: rf, p: rp });
  return rows;
}

function loansCalc(R) {
  const now = R.today || monthNow();
  const loans = R.loans.map(x => {
    const paid = Math.max(0, Math.min(x.count, x.first ? mDiff(x.first, now) + 1 : 0));
    const left = Math.max(0, x.sum - paid * x.pay);
    const lastM = x.first ? (() => { let k = x.first; for (let i = 1; i < x.count; i++) k = shiftMonth(k, 1); return k; })() : '';
    return Object.assign({ paid, left, lastM }, x);
  });
  return { loans, left: loans.reduce((s, x) => s + x.left, 0), pay: loans.filter(x => x.left > 0).reduce((s, x) => s + x.pay, 0) };
}

function drawReports() {
  loadOpen();
  const R = REP, ms = R.months;
  const idx = ms.map((m, i) => i).filter(i => ms[i] >= PFROM && ms[i] <= PTO);
  const X = plCalc(R, idx), { pl, factIdx, hasFact, val, F, P, alerts } = X;
  const opts = ms.map(m => `<option value="${m}">${mLabel(m)}${m > (R.factTo || '') ? ' (план)' : ''}</option>`).join('');
  const lastQ = ms.filter(m => m <= R.factTo).slice(-3);
  const yearOf = m => m.slice(0, 4);
  const dev = (f, p, isRev) => {
    if (!hasFact || !p) return '';
    const d = f - p, k = pct(f, p);
    const bad = isRev ? d < 0 : d > 0;
    if (Math.abs(d) < 1) return '<span class="muted">0</span>';
    return `<span class="${bad ? 'over' : 'under'}">${d > 0 ? '+' : ''}${tg0(d)}${k !== null ? ' (' + (k > 0 ? '+' : '') + k + '%)' : ''}</span>`;
  };
  const devS = (f, p, isRev) => {
    if (!hasFact || !p) return '';
    const d = f - p, k = pct(f, p);
    if (Math.abs(d) < 1) return '';
    const bad = isRev ? d < 0 : d > 0;
    return `<span class="${bad ? 'over' : 'under'}">${d > 0 ? '+' : ''}${nb(d)}${k !== null ? `<div class="dv">${k > 0 ? '+' : ''}${k}%</div>` : ''}</span>`;
  };
  // строка таблицы; tg = ключ, если строку можно раскрыть
  const row = (name, f, p, cls, isRev, tg, note) => `<tr class="${cls || ''}${tg ? ' tg' : ''}" ${tg ? `data-tg="${tg}"` : ''}><td>${tg ? arrow(isOpen(tg)) : ''}${esc(name)}${note ? `<div class="dv muted" style="font-weight:400">${esc(note)}</div>` : ''}</td><td class="n">${hasFact ? nb(f) : ''}</td><td class="n muted">${p === null ? '' : nb(p)}</td><td class="n">${p === null ? '' : devS(f, p, isRev)}</td></tr>`;
  const subs = grp => pl.filter(l => l.grp === grp).sort((a, b) => a.order - b.order).filter(l => Math.abs(val(l, 'f')) + Math.abs(val(l, 'p')) > 0);
  const grpBlock = (grp, title, f, p, isRev) => {
    const k = 'g:' + grp;
    if (!isOpen(k)) return row(title, f, p, 'g', isRev, k);
    return row(title, f, p, 'g', isRev, k) + subs(grp).map(l => {
      const zp = zpPeople(R, l, X);
      if (!zp) return row(l.name, val(l, 'f'), val(l, 'p'), 'sub', isRev);
      const kz = 'z:' + l.name;
      return row(l.name, val(l, 'f'), val(l, 'p'), 'sub', isRev, kz) + (isOpen(kz) ? zp.map(z => row(z.n, z.f, z.p, 'sub2', isRev)).join('') : '');
    }).join('');
  };
  // ДДС
  const dl = R.lines.filter(l => l.sec === 'ДДС');
  // только закрытые месяцы: строки текущего месяца по выпискам (Kaspi Pay, Halyk) живут в карточке «месяц по сегодня»
  const dIdx = idx.filter(i => R.months[i] <= R.factTo && dl.some(l => l.fact[i] !== null && l.grp !== 'Остаток на начало' && l.grp !== 'Остаток на конец'));
  const dv = l => sumRange(l.fact, dIdx) || 0;
  const dGrp = g => dl.filter(l => l.grp === g && Math.abs(dv(l)) > 0).sort((a, b) => a.order - b.order);
  const dSum = g => dGrp(g).reduce((s, l) => s + dv(l), 0);
  const startL = dl.find(l => l.grp === 'Остаток на начало'), endL = dl.find(l => l.grp === 'Остаток на конец');
  const endSum = endL && dIdx.length ? endL.fact[dIdx[dIdx.length - 1]] : 0;
  const dBlock = (grp, title) => {
    const items = dGrp(grp);
    if (!items.length) return '';
    const k = 'd:' + grp, open = isOpen(k);
    const line = (l, pad) => `<tr class="sub"><td${pad ? ' style="padding-left:28px"' : ''}>${esc(l.name)}</td><td class="n">${tg0(dv(l))}</td></tr>`;
    let body = items.map(l => line(l)).join('');
    if (grp === 'Поступления') {
      // услуги одной строкой с итогом (раскрывается по видам), товары и прочее отдельно
      const notServ = l => /товар|прочие поступления|по выписке|терминал/i.test(l.name);
      const serv = items.filter(l => !notServ(l)), rest = items.filter(notServ), ks = 'd:serv', os = isOpen(ks);

        + (os ? serv.map(l => line(l, true)).join('') : '') : '') + rest.map(l => line(l)).join('');
    }
    return `<tr class="g tg" data-tg="${k}"><td>${arrow(open)}${title}</td><td class="n">${tg0(dSum(grp))}</td></tr>` + (open ? body : '');
  };
  const ddsHtml = dIdx.length ? `
    <table class="rep"><tbody>

      ${dBlock('Выплаты', 'Выплаты')}
      ${dBlock('Инвестиции', 'Оборудование')}
      ${dBlock('Финансы', 'Кредиты и собственница')}
      <tr class="g"><td>Остаток на конец</td><td class="n">${tg0(endSum)}</td></tr>
    </tbody></table>
    <div class="muted" style="margin-top:6px">Остаток это счёт Kaspi Pay: выручка с него каждый день уходит на карту собственника.</div>` : '<div class="muted">За этот период движения денег нет (будет после внесения журнала).</div>';
  const L = loansCalc(R);
  const period = PFROM === PTO ? mLabel(PFROM) : mLabel(PFROM) + ' - ' + mLabel(PTO);

  $app.innerHTML = `
    <h1>Отчёты · ${esc(ME.client.name)}</h1>
    ${viewChips()}
    <div class="chips">
      <button class="chip" data-q="last">Последний месяц</button>
      <button class="chip" data-q="q">3 месяца</button>
      ${[...new Set(ms.map(yearOf))].map(y => `<button class="chip" data-q="y${y}">${y} год</button>`).join('')}
    </div>
    <div class="period">
      <label class="f" style="margin:0"><span>С месяца</span><select id="pf">${opts}</select></label>
      <label class="f" style="margin:0"><span>По месяц</span><select id="pt">${opts}</select></label>
    </div>
    ${!hasFact ? `<div class="notes">За ${esc(period)} факта ещё нет, показан только план. Факт есть по ${esc(mLabel(R.factTo))}.</div>` : (idx.length > factIdx.length ? `<div class="notes">Факт есть по ${esc(mLabel(R.factTo))}. План сравнивается только за месяцы с фактом.</div>` : '')}

    <div class="grid2">
      <div class="card"><div class="muted">Выручка</div><div class="big" style="font-size:20px">${hasFact ? tg0(F.rev) : 'нет факта'}</div><div class="muted">план ${tg0(P.rev)} ${dev(F.rev, P.rev, true)}</div></div>
      <div class="card"><div class="muted">Чистая прибыль</div><div class="big" style="font-size:20px">${hasFact ? tg0(F.net) : 'нет факта'}</div><div class="muted">план ${tg0(P.net)} ${dev(F.net, P.net, true)}</div><div class="muted" style="font-size:11px">по записанным расходам, возможна погрешность</div></div>
    </div>
    <div class="card">
      <div class="kv"><span>ЗП собственника (35% его услуг)</span><b>${tg0(hasFact ? F.zp : P.zp)}</b></div>
      <div class="kv"><span>Прибыль центра после её ЗП</span><b class="${(hasFact ? F.norm : P.norm) < 0 ? 'over' : ''}">${tg0(hasFact ? F.norm : P.norm)}</b></div>
    </div>

    <div class="chips seg mode">
      <button class="chip ${RMODE === 'short' ? 'on' : ''}" data-mode="short">Кратко</button>
      <button class="chip ${RMODE === 'full' ? 'on' : ''}" data-mode="full">Подробно</button>
      <span class="muted" style="align-self:center;font-size:12px">▸ нажмите строку, чтобы раскрыть</span>
    </div>

    ${hasFact ? block('alerts', 'Что вышло за план', alerts.length ? alerts.length + ' ' + plural(alerts.length, 'статья', 'статьи', 'статей') : 'всё в плане',
      `<div class="card">${alerts.length ? alerts.slice(0, 8).map(a => `<div class="alert"><span>${esc(a.t)}</span><b class="over">${a.d > 0 ? '+' : ''}${tg0(a.d)}</b></div>`).join('') : '<div class="muted">Всё в пределах плана</div>'}</div>`) : ''}

    ${block('opiu', `Прибыли и убытки (ОПиУ) · ${esc(period)}`, 'прибыль ' + tg0(hasFact ? F.net : P.net), `
    <div class="card" style="padding:10px"><table class="rep"><tbody>
      <tr class="h"><td>₸</td><td class="n">Факт</td><td class="n">План</td><td class="n">Откл.</td></tr>
      ${grpBlock('Выручка', 'Выручка', F.rev, P.rev, true)}
      ${grpBlock('Переменные', 'Переменные расходы', F.vr, P.vr)}
      ${grpBlock('Постоянные', 'Постоянные расходы', F.fx, P.fx)}
      ${row('Операционная прибыль', F.ebitda, P.ebitda, 'g', true)}
      ${grpBlock('Амортизация и налог', 'Налог и износ оборудования', F.bt, P.bt)}
      ${row('Чистая прибыль', F.net, P.net, 'g', true)}
      ${row('ЗП собственника (35%)', F.zp, P.zp, 'sub')}
      ${F.adj || P.adj ? row('ЗП других мастеров вне журнала', F.adj, P.adj, 'sub') : ''}

    ${block('dds', `Движение денег (ДДС) · ${esc(period)}`, dIdx.length ? 'на конец ' + tg0(endSum) : 'нет данных', `<div class="card" style="padding:10px">${ddsHtml}</div>`)}

    ${block('loans', 'Рассрочки', L.loans.length ? 'осталось ' + tg0(L.left) : 'нет', `
    <div class="card">${L.loans.length ? L.loans.map(x => `

        <div class="muted">осталось · ${x.paid} из ${x.count} платежей по ${tg0(x.pay)} · последний ${esc(x.lastM ? mLabel(x.lastM) : '')}</div>
        <div class="bar"><i style="width:${x.count ? Math.round(x.paid / x.count * 100) : 0}%"></i></div>

      </div>`).join('') + `<div class="kv"><span>Всего осталось</span><b>${tg0(L.left)}</b></div><div class="kv"><span>Платёж в месяц</span><b>${tg0(L.pay)}</b></div>` : '<div class="muted">Рассрочек нет</div>'}</div>`)}
    <div class="muted" style="padding:0 6px">Факт по ${esc(mLabel(R.factTo))}. План 2026: средний месяц 2026 года с сезонностью; 2027: бюджет из модели.</div>`;

  bindViews();
  bindToggles(drawReports);
  const pf = document.getElementById('pf'), pt = document.getElementById('pt');
  pf.value = PFROM; pt.value = PTO;
  pf.onchange = () => { PFROM = pf.value; if (PTO < PFROM) PTO = PFROM; drawReports(); };
  pt.onchange = () => { PTO = pt.value; if (PFROM > PTO) PFROM = PTO; drawReports(); };
  $app.querySelectorAll('[data-q]').forEach(b => b.onclick = () => {
    const q = b.dataset.q;
    if (q === 'last') PFROM = PTO = R.factTo;
    else if (q === 'q') { PFROM = lastQ[0]; PTO = lastQ[lastQ.length - 1]; }
    else { const y = q.slice(1); const inY = ms.filter(m => yearOf(m) === y); PFROM = inY[0]; PTO = inY[inY.length - 1]; }
    drawReports();
  });
}

// ---------- Текущий месяц по сегодня: услуги Altegio, приход по выпискам, сколько кому положено ----------
// Положено: % от своих услуг (Altegio, мастер ищется по первому слову имени) + оклад и таргет за прошедшие рабочие дни
// + бонус % от услуг центра. Условия с листа «Сотрудники».
function payList(days, rules, m, now) {
  const serv = days.reduce((s, x) => s + x.sum, 0), byFirst = {};
  days.forEach(x => Object.entries(x.staff || {}).forEach(([n, v]) => { const k = n.trim().split(/\s+/)[0].toLowerCase(); byFirst[k] = (byFirst[k] || 0) + v.sum; }));
  return [...new Set(rules.map(r => r.name))].map(n => {
    const r = ruleFor(rules, n, m);

// ---------- Условия оплаты ----------
const WD = { 'вс': 0, 'пн': 1, 'вт': 2, 'ср': 3, 'чт': 4, 'пт': 5, 'сб': 6 };
function offDays(s) { return String(s || '').toLowerCase().split(/[,\s]+/).map(x => WD[x.slice(0, 2)]).filter(x => x !== undefined); }
function ruleFor(rules, name, month) {
  return rules.filter(r => r.name === name && r.from <= month).sort((a, b) => a.from < b.from ? 1 : -1)[0] || null;
}
function workdays(month, off) {
  const [y, m] = month.split('-').map(Number), n = new Date(y, m, 0).getDate(), o = offDays(off);
  let c = 0; for (let d = 1; d <= n; d++) if (!o.includes(new Date(y, m - 1, d).getDay())) c++;
  return c;
}
function tabelShare(tabel, name, month, off) {
  const t = (tabel || []).find(x => x.name === name && x.month === month);
  if (!t) return 1;
  const w = workdays(month, off);
  return w ? Math.min(1, t.days / w) : 1;
}

// ---------- Сотрудники: положено и выплачено по месяцам ----------
function drawStaff() {
  const R = REP, ms = R.months, rules = R.staff || [];
  const idx = ms.map((m, i) => i).filter(i => ms[i] >= PFROM && ms[i] <= PTO && ms[i] <= R.factTo);
  const opts = ms.filter(m => m <= R.factTo).map(m => `<option value="${m}">${mLabel(m)}</option>`).join('');
  const center = R.lines.find(l => l.sec === 'ОПиУ' && l.name === 'Услуги');
  const sl = R.lines.filter(l => l.sec === 'Сотрудники');
  const people = [...new Set(sl.map(l => l.grp))];
  const cards = people.map(name => {
    const serv = sl.find(l => l.grp === name && l.name === 'Услуги'), paid = sl.find(l => l.grp === name && l.name === 'Выплачено');
    let s = 0, acc = 0, sal = 0, tgt = 0, bon = 0, pd = 0, anyPaid = false, role = '', pct = 0, cpct = 0;
    idx.forEach(i => {
      const m = ms[i], r = ruleFor(rules, name, m);
      if (!r) return;
      role = r.role; pct = r.pct; cpct = r.centerPct;
      const sv = serv ? (serv.fact[i] || 0) : 0, share = tabelShare(R.tabel, name, m, r.off);
      s += sv;
      const own = sv * r.pct / 100, a = r.salary * share, b = r.target * share, tb = (R.tabel || []).find(x => x.name === name && x.month === m), bShare = tb && /бонус полност/i.test(tb.note || '') ? 1 : share,
        c = (center && center.fact[i] || 0) * r.centerPct / 100 * bShare;
      acc += own + a + b + c; sal += a; tgt += b; bon += c;
      if (paid && paid.fact[i] !== null) { pd += paid.fact[i]; anyPaid = true; }
    });
    if (!role) return '';
    const last = rules.filter(x => x.name === name).slice(-1)[0];
    const diff = acc - pd;
    // «без долга» или «уволен(а)» в примечании на листе «Сотрудники»: долг не показываем
    const fired = last && /уволен/i.test(last.note || '');
    const noDebt = last && (fired || /без долга/i.test(last.note || ''));
    return `<div class="card">
      <div class="row"><b>${esc(name)}</b><span class="muted">${esc(role)}${last && last.off ? ' · выходные ' + esc(last.off) : ''}</span></div>
      <div style="margin-top:6px">
        ${s ? `<div class="kv"><span>Услуги (Altegio)</span><b>${tg0(s)}</b></div>` : ''}
        ${s && pct ? `<div class="kv"><span>${pct}% от своих услуг</span><b>${tg0(s * pct / 100)}</b></div>` : ''}
        ${sal ? `<div class="kv"><span>Оклад</span><b>${tg0(sal)}</b></div>` : ''}
        ${tgt ? `<div class="kv"><span>Таргет</span><b>${tg0(tgt)}</b></div>` : ''}
        ${bon ? `<div class="kv"><span>Бонус ${cpct}% от услуг центра</span><b>${tg0(bon)}</b></div>` : ''}
        <div class="kv"><span><b>Положено</b></span><b class="gold">${tg0(acc)}</b></div>
        ${anyPaid ? `<div class="kv"><span>Выплачено (журнал)</span><b>${tg0(pd)}</b></div>
        ${noDebt ? `<div class="muted" style="margin-top:4px">${fired ? 'Уволена, расчёт закрыт: долг не показываем.' : 'Долг не считаем: часть записей в Altegio шла на других мастеров.'}</div>`
          : `<div class="kv"><span>${diff >= 0 ? 'Не доплачено' : 'Переплачено'}</span><b class="${Math.abs(diff) > 1000 ? 'over' : 'under'}">${tg0(Math.abs(diff))}</b></div>`}`
        : `<div class="muted" style="margin-top:4px">${/собствен/i.test(role) ? 'Выплат в журнале нет: собственница берёт из прибыли.' : 'Выплат за период в журнале нет.'}</div>`}
      </div></div>`;
  }).join('');
  $app.innerHTML = `
    <h1>Отчёты · ${esc(ME.client.name)}</h1>
    ${viewChips()}
    <div class="period">
      <label class="f" style="margin:0"><span>С месяца</span><select id="pf">${opts}</select></label>
      <label class="f" style="margin:0"><span>По месяц</span><select id="pt">${opts}</select></label>
    </div>
    <div class="muted" style="margin:0 6px 8px">За ${esc(mLabel(PFROM))} - ${esc(mLabel(PTO))}: положено и выплачено по журналу</div>
    ${idx.length ? cards : '<div class="card muted">За этот период данных нет. Факт есть по ' + esc(mLabel(R.factTo)) + '.</div>'}
    ${monthNow() > R.factTo ? `<h2>${MONTHS[new Date().getMonth()]}: месяц ещё идёт</h2><div class="muted" style="margin:-4px 6px 8px">Не входит в период выше: журнала за этот месяц ещё нет, считаем по Altegio.</div>${curMonthCard()}` : ''}
    <div class="muted" style="padding:0 6px">Условия и выходные на листе «Сотрудники», отпуска на листе «Табель» в таблице клиента. Выплаты из журнала администратора. Мастерам процент от услуг без предоплат.</div>`;
  bindViews();
  const pf = document.getElementById('pf'), pt = document.getElementById('pt');
  if (PFROM > R.factTo) PFROM = R.factTo;
  if (PTO > R.factTo) PTO = R.factTo;
  pf.value = PFROM; pt.value = PTO;
  pf.onchange = () => { PFROM = pf.value; if (PTO < PFROM) PTO = PFROM; drawStaff(); };
  pt.onchange = () => { PTO = pt.value; if (PFROM > PTO) PFROM = PTO; drawStaff(); };
  if (monthNow() > R.factTo) fillCurMonth();
}

let DAYPER = 'week0', DAYDATA = null, DAYOPEN = '';

function dayRange(k) {
  const now = new Date(), d0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  if (k === 'today') return [d0, d0];
  if (k === 'yest') { const y = new Date(d0); y.setDate(y.getDate() - 1); return [y, y]; }
  if (k === 'week0' || k === 'week1') {
    const mon = new Date(d0); mon.setDate(d0.getDate() - ((d0.getDay() + 6) % 7) - (k === 'week1' ? 7 : 0));
    const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
    return [mon, sun];
  }
  const a = new Date(d0.getFullYear(), d0.getMonth() - (k === 'month1' ? 1 : 0), 1);
  return [a, new Date(a.getFullYear(), a.getMonth() + 1, 0)];
}

  const by = {};

  const month = from.slice(0, 7);

      const w = workdays(m, r.off), day = D.days.find(x => x.date === ymd(d));

function kidsPlan(ref) {

function personalRows(D) {

let BUYF = 'need', BUYDATA = null;

function drawBuy() {
  const r = BUYDATA;
  const g = r.goods || [];
  const grp = x => x.stock === null ? 'none' : x.stock < 0 ? 'neg' : x.stock === 0 ? 'zero' : (x.min > 0 && x.stock <= x.min) ? 'low' : 'ok';
  const groups = [['need', 'Купить'], ['neg', 'В минусе'], ['zero', 'Закончилось'], ['low', 'Заканчивается'], ['ok', 'Есть'], ['all', 'Все']];
  const cnt = k => k === 'all' ? g.length : k === 'need' ? g.filter(x => ['zero', 'low'].includes(grp(x))).length : g.filter(x => grp(x) === k).length;
  const list = g.filter(x => BUYF === 'all' || (BUYF === 'need' ? ['zero', 'low'].includes(grp(x)) : grp(x) === BUYF))
    .sort((a, b) => (a.stock ?? 0) - (b.stock ?? 0));
  const value = g.filter(x => x.stock > 0).reduce((s, x) => s + x.stock * (x.buy || 0), 0);
  const cls = { neg: 'check-bad', zero: 'check-bad', low: 'gold', ok: 'muted', none: 'muted' };
  $app.innerHTML = `

    </div>
    ${ME.user.approver && value ? `<div class="card"><div class="kv"><span>Товар на складе по себестоимости</span><b>${money(Math.round(value))}</b></div></div>` : ''}
    <div class="chips">${groups.map(([k, t]) => `<button class="chip ${k === BUYF ? 'on' : ''}" data-bf="${k}">${t} ${cnt(k)}</button>`).join('')}</div>
    <div class="card" style="padding:6px 14px">${list.length ? list.map(x => `
      <div class="lowitem"><span>${esc(x.title)}</span>
        <span class="${cls[grp(x)]}" style="white-space:nowrap">${x.stock === null ? 'нет данных' : esc(x.stock) + ' ' + esc(unitRu(x.unit))}${x.min ? ` <span class="muted">(мин. ${esc(x.min)})</span>` : ''}</span></div>`).join('')

    <div class="notes">После инвентаризации здесь будет заказ поставщику: что и сколько купить. Пока остатки в Altegio неточные.</div>
    <div class="muted" style="margin:8px 6px">Обновлено из Altegio: ${esc(r.synced || 'ещё не загружали')}</div>
    ${ME.user.approver ? '<div class="btns"><button class="btn sec" id="sync">Обновить из Altegio</button></div>' : ''}`;
  $app.querySelectorAll('[data-bf]').forEach(b => b.onclick = () => { BUYF = b.dataset.bf; drawBuy(); });
  const sync = document.getElementById('sync');
  if (sync) sync.onclick = async () => {
    sync.disabled = true; sync.textContent = 'Загружаю товары и справочники…';
    try { const x = await api('syncAltegio'); toast(`Загружено товаров: ${x.goods}`); renderBuy(); }
    catch (e) { toast(e.message); sync.disabled = false; sync.textContent = 'Обновить из Altegio'; }
  };
}

    try { await api('approve', { id }); }
    catch (err) {
      delete OVR[id]; haptic('error'); toast(id + ' не утверждён: ' + err.message + '. Откройте документ и проверьте поля.');
      if (TAB === tab && !CUR) go(tab);
    }
  });
}

// ====== Загрузка ======
function renderUpload() {
  $app.innerHTML = `
    <h1>Новый документ</h1>
    <div class="card">
      <label class="drop" for="file"><b>Сфотографировать или выбрать</b>накладная, чек, счёт-фактура, акт. Можно несколько страниц одного документа</label>
      <input type="file" id="file" accept="image/*,application/pdf" multiple hidden>
      <div class="thumbs" id="thumbs"></div>
      <label class="f"><span>Оплата</span><select id="pay">${ME.payments.map(p => `<option>${esc(p)}</option>`).join('')}</select></label>
      <label class="f"><span>Комментарий (необязательно)</span><textarea id="comment" placeholder="например: оплатила наличными из кассы"></textarea></label>
      <div class="btns"><button class="btn" id="send" disabled>Отправить на распознавание</button></div>
    </div>
    <div class="muted" style="padding:0 6px">Фото должно быть ровным и чётким, документ целиком в кадре. Распознавание занимает до минуты. Одностраничный чек можно просто отправить фото в чат бота.</div>`;
  PENDING_FILES = [];
  document.getElementById('file').onchange = async e => {
    for (const f of e.target.files) {
      if (PENDING_FILES.length >= 6) { toast('Не больше 6 страниц'); break; }
      try { PENDING_FILES.push(await prepareFile(f)); } catch (err) { toast(err.message); }
    }
    e.target.value = '';
    drawThumbs();
  };
  document.getElementById('send').onclick = sendUpload;
}
function drawThumbs() {
  const t = document.getElementById('thumbs');
  t.innerHTML = PENDING_FILES.map((f, i) => f.mime === 'application/pdf'
    ? `<div class="pdf" data-i="${i}">PDF ✕</div>`
    : `<img src="data:${f.mime};base64,${f.data}" data-i="${i}" alt="">`).join('');
  t.querySelectorAll('[data-i]').forEach(el => el.onclick = () => { PENDING_FILES.splice(Number(el.dataset.i), 1); drawThumbs(); });
  document.getElementById('send').disabled = PENDING_FILES.length === 0;
}
function prepareFile(file) {
  return new Promise((resolve, reject) => {
    if (file.type === 'application/pdf') {
      if (file.size > 8 * 1024 * 1024) return reject(new Error('PDF больше 8 МБ'));
      const r = new FileReader();
      r.onload = () => resolve({ mime: 'application/pdf', data: String(r.result).split(',')[1] });
      r.onerror = () => reject(new Error('Не удалось прочитать файл'));
      return r.readAsDataURL(file);
    }
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 2000, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve({ mime: 'image/jpeg', data: c.toDataURL('image/jpeg', 0.85).split(',')[1] });
    };
    img.onerror = () => reject(new Error('Это не фото'));
    img.src = url;
  });
}
async function sendUpload() {
  const pay = document.getElementById('pay').value, comment = document.getElementById('comment').value;
  const files = PENDING_FILES.slice();
  loading('Распознаю документ… обычно 20-60 секунд');
  try {
    const doc = await api('upload', { files, payment: pay, comment });
    haptic(doc.status === 'Ошибка распознавания' ? 'error' : 'success');
    PENDING_FILES = [];
    openDoc(doc.id);
  } catch (e) {
    if (e.message === 'no_access') return;
    haptic('error'); toast(e.message); renderUpload(); PENDING_FILES = files; drawThumbs();
  }
}

// ====== Список ======
let DPER = 'all', DOFF = 0;   // период списка: неделя, месяц или всё; DOFF = сдвиг назад
function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function dm(d) { return String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0'); }
function docPeriod() {
  const now = new Date();
  if (DPER === 'week') {
    const mon = new Date(now.getFullYear(), now.getMonth(), now.getDate() - ((now.getDay() + 6) % 7) + DOFF * 7);
    const sun = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + 6);
    return { from: ymd(mon), to: ymd(sun), label: dm(mon) + '-' + dm(sun) };
  }
  if (DPER === 'month') {
    const a = new Date(now.getFullYear(), now.getMonth() + DOFF, 1), b = new Date(a.getFullYear(), a.getMonth() + 1, 0);
    return { from: ymd(a), to: ymd(b), label: MONTHS[a.getMonth()] + ' ' + a.getFullYear() };
  }
  return { from: '', to: '', label: 'за всё время' };
}
async function renderDocs() {
  const filters = ['На проверке', 'Утверждён', 'Отклонён', 'Ошибка распознавания', 'Все'];
  const p = docPeriod();
  $app.innerHTML = `<div class="row"><h1>Документы</h1><div style="display:flex;gap:6px"><button class="btn sec" data-man style="width:auto;padding:9px 12px;font-size:14px">✍️ Без чека</button><button class="btn" data-up style="width:auto;padding:9px 12px;font-size:14px">📷 Загрузить</button></div></div>
    <div class="chips">${[['week', 'Неделя'], ['month', 'Месяц'], ['all', 'Всё время']].map(([k, t]) => `<button class="chip ${k === DPER ? 'on' : ''}" data-p="${k}">${t}</button>`).join('')}</div>
    ${DPER !== 'all' ? `<div class="row" style="margin:0 2px 8px"><div class="monthsw"><button data-o="-1">‹</button><b>${esc(p.label)}</b><button data-o="1" ${DOFF >= 0 ? 'disabled' : ''}>›</button></div></div>` : ''}
    <div class="chips">${filters.map(f => `<button class="chip ${f === DOCFILTER ? 'on' : ''}" data-f="${f}">${f}</button>`).join('')}</div>
    <div id="list"><div class="center"><div class="spin"></div></div></div>`;
  $app.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { DOCFILTER = b.dataset.f; renderDocs(); });
  bindUpload();
  $app.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { DPER = b.dataset.p; DOFF = 0; renderDocs(); });
  $app.querySelectorAll('[data-o]').forEach(b => b.onclick = () => { DOFF = Math.min(0, DOFF + Number(b.dataset.o)); renderDocs(); });
  const want = { status: DOCFILTER, from: p.from, to: p.to }, wkey = JSON.stringify(want);
  const $list = () => document.getElementById('list');
  return load('list', want, {
    alive: () => TAB === 'docs' && !CUR && !!$list() && JSON.stringify({ status: DOCFILTER, from: docPeriod().from, to: docPeriod().to }) === wkey,
    fail: e => { $list().innerHTML = `<div class="card">${esc(e.message)}</div>`; },
    draw: r => {
      const docs = withOvr(r.docs, want.status);
      const sum = docs.reduce((s, d) => s + (Number(d.total) || 0), 0);
      $list().innerHTML = docs.length
        ? `<div class="muted" style="margin:0 6px 8px">${docs.length} ${plural(docs.length, 'документ', 'документа', 'документов')} на ${money(sum)}${DOCFILTER === 'На проверке' && ME.user.approver ? ' · ✓ утверждает без открытия' : ''}</div><div class="dlist">${docs.map(docRow).join('')}</div>`
        : '<div class="card muted">Пусто</div>';
      bindDocCards();
    },
  });
}

// ====== Карточка документа ======
// Документ: поля из памяти телефона сразу (без фото), фото и свежие поля следом.
// Если уже начали править поля, свежие данные их не затирают, подставляются только фото.
let DIRTY = false;
async function openDoc(id) {
  CUR = id; DIRTY = false;
  if (tg) { tg.BackButton.show(); }
  const k = ckey('get', { id }), old = cget(k);
  if (old) { renderDoc(Object.assign({}, old, { photos: null })); refreshing(true); }
  else loading();
  try {
    const d = await api('get', { id });
    const lite = Object.assign({}, d); delete lite.photos;
    cput(k, lite);
    if (CUR !== id) return;
    if (!old || !DIRTY) { const y = window.scrollY; renderDoc(d); if (old) window.scrollTo(0, y); }
    else { const ph = document.querySelector('.photos'); if (ph) ph.innerHTML = photosHtml(d.photos); }
  } catch (e) {
    if (e.message === 'no_access' || CUR !== id) return;
    if (old) toast('Не удалось обновить: ' + e.message); else failCard(e);
  } finally { if (old) refreshing(false); }
}
function photosHtml(ph) {
  if (!ph) return '<div class="muted wait">Фото загружается…</div>';
  return ph.map(p => p.mime === 'application/pdf' ? '<div class="muted">PDF файл</div>' : `<img src="data:${p.mime};base64,${p.data}" alt="">`).join('');
}
// Утвердить или отклонить: сразу возвращаемся к списку, Google сохраняет в фоне; при ошибке документ откроется снова
function decideBg(d, ok, send) {
  const status = ok ? 'Утверждён' : 'Отклонён', back = TAB === 'home' ? 'home' : 'docs';
  OVR[d.id] = status; haptic('success'); toast((ok ? 'Утверждено: ' : 'Отклонено: ') + d.id);
  go(back);
  send().then(r => {
    if (r && r.altegioResult) toast('Altegio: ' + r.altegioResult);
  }).catch(e => {
    delete OVR[d.id]; haptic('error'); toast(d.id + (ok ? ' не утверждён: ' : ' не отклонён: ') + e.message);
    openDoc(d.id);
  });
}
function renderDoc(d) {
  const ro = d.canEdit ? '' : 'disabled';
  const opt = (arr, v) => arr.map(x => `<option ${x === v ? 'selected' : ''}>${esc(x)}</option>`).join('');
  const catOpts = v => `<option value=""></option>` + opt(ME.cats, v);
  $app.innerHTML = `
    <div class="row"><h1>${esc(d.id)}</h1>${badge(d.status)}</div>
    <div class="card">
      <div class="photos">${photosHtml(d.photos)}</div>
      <div class="muted" style="margin-top:6px">Загрузил(а) ${esc(d.uploader)}, ${esc(d.uploaded)}${d.reviewer ? ' · проверил(а) ' + esc(d.reviewer) : ''}</div>
    </div>
    <div class="card">
      <div class="${checkClass(d.check)}" style="font-weight:600">${esc(d.check || '')}</div>
      ${d.notes ? `<div class="notes">${esc(d.notes)}</div>` : ''}
    </div>
    <div class="card" id="form">
      <div class="grid2">
        <label class="f"><span>Вид</span><select name="kind" ${ro}>${opt(ME.kinds, d.kind)}</select></label>
        <label class="f"><span>Номер</span><input name="number" value="${esc(d.number)}" ${ro}></label>
        <label class="f"><span>Дата (ДД.ММ.ГГГГ)</span><input name="date" value="${esc(d.date)}" inputmode="numeric" ${ro}></label>
        <label class="f"><span>Сумма, ₸</span><input name="total" value="${esc(d.total)}" inputmode="decimal" ${ro}></label>
      </div>
      <label class="f"><span>Контрагент</span><input name="counterparty" value="${esc(d.counterparty)}" ${ro}></label>
      <div class="grid2">
        <label class="f"><span>БИН/ИИН</span><input name="bin" value="${esc(d.bin)}" inputmode="numeric" ${ro}></label>
        <label class="f"><span>Оплата</span><select name="payment" ${ro}>${opt(ME.payments, d.payment)}</select></label>
      </div>
      <label class="f"><span>Статья</span><select name="category" ${ro}>${catOpts(d.category)}</select></label>
      <label class="f"><span>Комментарий</span><textarea name="comment" ${ro}>${esc(d.comment)}</textarea></label>
    </div>
    <h2>Строки документа · ${money(d.linesSum)}</h2>
    <div class="card"><table><tbody>${d.lines.map(l => `
      <tr><td>${esc(l.name)}<div class="alt ${l.goodId ? 'yes' : 'no'}">${l.goodId ? 'Altegio: ' + esc(l.goodTitle) : 'нет в Altegio'}</div>
        ${d.canEdit ? `<select data-line="${l.no - 1}" style="margin-top:4px;padding:6px;font-size:13px">${catOpts(l.category)}</select>` : `<div class="muted">${esc(l.category)}</div>`}</td>
      <td class="n">${esc(l.qty)} ${esc(unitRu(l.unit))}<div class="muted">× ${money(l.price)}</div></td>
      <td class="n"><b>${money(l.sum)}</b></td></tr>`).join('') || '<tr><td class="muted">Строк нет</td></tr>'}</tbody></table></div>
    ${d.altegio ? `<div class="card"><b>Altegio:</b> ${esc(d.altegio)}</div>` : ''}
    <div class="btns">
      ${d.canEdit ? '<button class="btn sec" id="save">Сохранить изменения</button>' : ''}
      ${d.canApprove ? '<input id="reason" placeholder="Причина, если отклоняете"><div class="btns two" style="margin:0"><button class="btn ok" id="approve">Утвердить</button><button class="btn bad" id="reject">Отклонить</button></div>' : ''}
      ${d.canEdit && d.status !== 'Утверждён' && d.kind !== 'Без документа' ? '<button class="btn sec" id="retry">Распознать заново</button>' : ''}
      ${ME.user.approver && d.status === 'Утверждён' && !d.altegioId ? '<button class="btn" id="toAltegio">Отправить в Altegio</button>' : ''}
    </div>`;
  const form = () => {
    const f = {};
    document.querySelectorAll('#form [name]').forEach(el => f[el.name] = el.value.trim());
    return f;
  };
  const lines = () => d.lines.map((l, i) => {
    const sel = document.querySelector(`[data-line="${i}"]`);
    return { name: l.name, qty: l.qty, unit: l.unit, price: l.price, sum: l.sum, category: sel ? sel.value : l.category, goodId: l.goodId };
  });
  const act = async (btn, fn, okText) => {
    const b = document.getElementById(btn); if (!b) return;
    b.onclick = async () => {
      b.disabled = true;
      try { const r = await fn(); haptic('success'); toast(okText + (r && r.altegioResult ? ' · Altegio: ' + r.altegioResult : '')); openDoc(d.id); }
      catch (e) { haptic('error'); toast(e.message); b.disabled = false; if (!document.body.contains(b)) openDoc(d.id); }
    };
  };
  document.querySelectorAll('#form [name], [data-line], #reason').forEach(el => el.addEventListener('input', () => { DIRTY = true; }));
  act('save', () => api('update', { id: d.id, fields: form(), lines: d.canEdit ? lines() : undefined }), 'Сохранено');
  const ap = document.getElementById('approve');
  if (ap) ap.onclick = () => {
    const f = d.canEdit ? form() : { category: d.category, date: d.date };
    if (!f.category) { haptic('error'); return toast('Выберите статью'); }
    if (!f.date) { haptic('error'); return toast('Укажите дату документа'); }
    const ln = d.canEdit ? lines() : null;
    decideBg(d, true, async () => { if (d.canEdit) await api('update', { id: d.id, fields: f, lines: ln }); return api('approve', { id: d.id }); });
  };
  const rj = document.getElementById('reject');
  if (rj) rj.onclick = () => {
    const reason = document.getElementById('reason').value.trim();
    if (!reason) { haptic('error'); return toast('Напишите причину отклонения'); }
    decideBg(d, false, () => api('reject', { id: d.id, reason }));
  };
  act('retry', () => { loading('Распознаю заново…'); return api('retry', { id: d.id }); }, 'Распознано заново');
  act('toAltegio', async () => { const r = await api('sendAltegio', { id: d.id }); return { altegioResult: r.result }; }, 'Отправлено');
}

// ====== Клиент ======
function applyMe(me) {
  const changed = !ME || ME.client.code !== me.client.code;
  ME = me;
  CLIENT = ME.client.code;
  localStorage.setItem('client', CLIENT);
  document.title = ME.client.name;
  if (changed) { REP = null; DAYDATA = null; BUYDATA = null; }
  $nav.querySelector('[data-tab="reports"]').hidden = !ME.user.approver;
  $nav.querySelector('[data-tab="personal"]').hidden = !ME.user.personal;
  $nav.hidden = false;
}
// «Кто я» и Сводка одним обращением к Google; прошлые данные показываем сразу
async function boot(docParam) {
  const meKey = CK + UID + ':me:' + CLIENT;
  const oldMe = CLIENT ? cget(meKey) : null;
  let shown = false;
  const homeTab = () => { TAB = 'home'; CUR = null; if (tg) tg.BackButton.hide(); [...$nav.children].forEach(b => b.classList.toggle('on', b.dataset.tab === 'home')); };
  if (oldMe) {
    applyMe(oldMe);
    homeTab();
    const oldS = cget(ckey('summary', { month: MONTH }));
    if (oldS) { drawHome(oldS); shown = true; refreshing(true); }
    else loading();
    if (docParam) openDoc(docParam);
  } else loading('Подключаюсь…');
  try {
    const month = MONTH;
    const r = await api('start', { month });
    applyMe(r.me);
    cput(CK + UID + ':me:' + CLIENT, r.me);
    const sKey = ckey('summary', { month });
    const same = shown && JSON.stringify(cget(sKey)) === JSON.stringify(r.summary);
    cput(sKey, r.summary);
    if (!oldMe) { homeTab(); drawHome(r.summary); if (docParam) openDoc(docParam); }
    else if (TAB === 'home' && !CUR && MONTH === month && (!same || !shown)) { const y = window.scrollY; drawHome(r.summary); window.scrollTo(0, y); }
  } catch (e) {
    if (e.message === 'no_access') return;
    if (shown) toast('Не удалось обновить: ' + e.message);
    else $app.innerHTML = `<div class="card">Не удалось подключиться: ${esc(e.message)}</div>`;
  } finally { if (shown) refreshing(false); }
}
async function switchClient(code) {
  CLIENT = code;
  await boot();
}

// ====== Запуск ======
async function start() {
  if (tg) {
    tg.ready(); tg.expand();
    tg.BackButton.onClick(() => go(TAB === 'upload' || TAB === 'manual' ? 'docs' : TAB));
    try { tg.setHeaderColor('#0f1216'); tg.setBackgroundColor('#0f1216'); } catch (e) {}
    try { if (tg.setBottomBarColor) tg.setBottomBarColor('#1a1e25'); } catch (e) {}
    // На телефоне: на весь экран, как в видео (Telegram 8.0 и новее). Свайп вниз не закрывает приложение.
    const mobile = ['ios', 'android', 'android_x'].includes(tg.platform);
    try { if (mobile && tg.isVersionAtLeast && tg.isVersionAtLeast('8.0') && tg.requestFullscreen) tg.requestFullscreen(); } catch (e) {}
    try { if (tg.isVersionAtLeast && tg.isVersionAtLeast('7.7') && tg.disableVerticalSwipes) tg.disableVerticalSwipes(); } catch (e) {}
  }
  if (!tg || !tg.initData) {
    $app.innerHTML = '<div class="card center"><h1>Финансы с Арайлым</h1><p>Откройте приложение через бота в Telegram.</p></div>';
    return;
  }
  await boot(new URLSearchParams(location.search).get('doc'));
}
start();
</script>
